// AutoConfig script for OpenPublisher Gecko
(function() {
    const Cc = Components.classes;
    const Ci = Components.interfaces;
    const Cu = Components.utils;
    const Cr = Components.results;

    try {
        if (Cu && typeof Cu.importGlobalProperties === "function") {
            ["btoa", "atob", "XMLHttpRequest", "TextDecoder", "TextEncoder"].forEach(function(prop) {
                try { Cu.importGlobalProperties([prop]); } catch(e) {}
            });
        }
    } catch(igpErr) {}

    // Dynamically resolve application root directory (<appRoot>/firefox/core -> <appRoot>)
    let appRootDir = null;
    try {
        let greD = Services.dirsvc.get("GreD", Ci.nsIFile);
        if (greD && greD.parent && greD.parent.parent) {
            appRootDir = greD.parent.parent.clone();
        }
    } catch(e) {}
    if (!appRootDir) {
        try {
            let profD = Services.dirsvc.get("ProfD", Ci.nsIFile);
            if (profD && profD.parent) {
                appRootDir = profD.parent.clone();
            }
        } catch(e2) {}
    }

    function logDebug(str) {
        try {
            if (!appRootDir) return;
            let file = appRootDir.clone();
            file.append("gecko_debug.log");
            let foStream = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
            foStream.init(file, 0x02 | 0x08 | 0x10, 0x1b6, 0);
            let cos = Cc["@mozilla.org/intl/converter-output-stream;1"].createInstance(Ci.nsIConverterOutputStream);
            cos.init(foStream, "UTF-8", 0, 0);
            cos.writeString(new Date().toISOString() + " [AutoConfig] " + str + "\n");
            cos.close();
        } catch(e) {}
    }

    function encodeB64Bytes(binStr) {
        if (typeof btoa === "function") return btoa(binStr);
        if (mainOPWindow && typeof mainOPWindow.btoa === "function") return mainOPWindow.btoa(binStr);
        return "";
    }

    function decodeB64Bytes(b64Str) {
        let clean = String(b64Str || "").replace(/\s+/g, "");
        if (typeof atob === "function") return atob(clean);
        if (mainOPWindow && typeof mainOPWindow.atob === "function") return mainOPWindow.atob(clean);
        return "";
    }

    let mainOPWindow = null;
    let pendingChildSpecs = [];
    let isNativePickerOpen = false;
    let lastPickedDir = null;

    try {
        logDebug("AutoConfig initialized. AppRoot: " + (appRootDir ? appRootDir.path : "unknown") + " | PID: " + (Services.appinfo ? Services.appinfo.processID : "unknown"));

        // Win32 Native Window Management, Icons, & Clipboard via js-ctypes
        let ctypes = null;
        let user32 = null;
        let user32_ReleaseCapture = null;
        let user32_SendMessageW = null;
        let user32_PostMessageW = null;
        let user32_SetWindowPos = null;
        let user32_LoadImageW = null;
        let user32_OpenClipboard = null;
        let user32_CloseClipboard = null;
        let user32_IsClipboardFormatAvailable = null;
        let user32_RegisterClipboardFormatW = null;
        let user32_GetClipboardData = null;
        let user32_ShowWindow = null;
        let user32_SetForegroundWindow = null;
        let user32_FlashWindow = null;
        let kernel32 = null;
        let kernel32_GlobalLock = null;
        let kernel32_GlobalUnlock = null;
        let kernel32_GlobalSize = null;
        let kernel32_GetUserDefaultLocaleName = null;
        let shell32 = null;
        let shell32_ShellExecuteW = null;
        let shell32_Shell_NotifyIconW = null;
        let NOTIFYICONDATAW_TYPE = null;
        let cachedSmallIcon = null;
        let cachedBigIcon = null;

        try {
            if (typeof ChromeUtils !== "undefined" && typeof ChromeUtils.importESModule === "function") {
                ctypes = ChromeUtils.importESModule("resource://gre/modules/ctypes.sys.mjs").ctypes;
            } else if (Cu && typeof Cu.import === "function") {
                ctypes = Cu.import("resource://gre/modules/ctypes.jsm", {}).ctypes;
            }
            if (ctypes) {
                user32 = ctypes.open("user32.dll");
                user32_ReleaseCapture = user32.declare("ReleaseCapture", ctypes.winapi_abi, ctypes.bool);
                user32_SendMessageW = user32.declare("SendMessageW", ctypes.winapi_abi, ctypes.intptr_t, ctypes.voidptr_t, ctypes.uint32_t, ctypes.uintptr_t, ctypes.intptr_t);
                user32_PostMessageW = user32.declare("PostMessageW", ctypes.winapi_abi, ctypes.bool, ctypes.voidptr_t, ctypes.uint32_t, ctypes.uintptr_t, ctypes.intptr_t);
                user32_SetWindowPos = user32.declare("SetWindowPos", ctypes.winapi_abi, ctypes.bool, ctypes.voidptr_t, ctypes.voidptr_t, ctypes.int32_t, ctypes.int32_t, ctypes.int32_t, ctypes.int32_t, ctypes.uint32_t);
                user32_LoadImageW = user32.declare("LoadImageW", ctypes.winapi_abi, ctypes.voidptr_t, ctypes.voidptr_t, ctypes.jschar.ptr, ctypes.uint32_t, ctypes.int32_t, ctypes.int32_t, ctypes.uint32_t);
                user32_OpenClipboard = user32.declare("OpenClipboard", ctypes.winapi_abi, ctypes.bool, ctypes.voidptr_t);
                user32_CloseClipboard = user32.declare("CloseClipboard", ctypes.winapi_abi, ctypes.bool);
                user32_IsClipboardFormatAvailable = user32.declare("IsClipboardFormatAvailable", ctypes.winapi_abi, ctypes.bool, ctypes.uint32_t);
                user32_RegisterClipboardFormatW = user32.declare("RegisterClipboardFormatW", ctypes.winapi_abi, ctypes.uint32_t, ctypes.jschar.ptr);
                user32_GetClipboardData = user32.declare("GetClipboardData", ctypes.winapi_abi, ctypes.voidptr_t, ctypes.uint32_t);

                kernel32 = ctypes.open("kernel32.dll");
                kernel32_GlobalLock = kernel32.declare("GlobalLock", ctypes.winapi_abi, ctypes.voidptr_t, ctypes.voidptr_t);
                kernel32_GlobalUnlock = kernel32.declare("GlobalUnlock", ctypes.winapi_abi, ctypes.bool, ctypes.voidptr_t);
                kernel32_GlobalSize = kernel32.declare("GlobalSize", ctypes.winapi_abi, ctypes.size_t, ctypes.voidptr_t);
                try {
                    kernel32_GetUserDefaultLocaleName = kernel32.declare("GetUserDefaultLocaleName", ctypes.winapi_abi, ctypes.int32_t, ctypes.jschar.ptr, ctypes.int32_t);
                } catch(locDeclErr) {}

                shell32 = ctypes.open("shell32.dll");
                shell32_ShellExecuteW = shell32.declare("ShellExecuteW", ctypes.winapi_abi, ctypes.intptr_t, ctypes.voidptr_t, ctypes.jschar.ptr, ctypes.jschar.ptr, ctypes.jschar.ptr, ctypes.jschar.ptr, ctypes.int32_t);
                try {
                    let GUID_TYPE = ctypes.StructType("GUID", [
                        { d1: ctypes.uint32_t },
                        { d2: ctypes.uint16_t },
                        { d3: ctypes.uint16_t },
                        { d4: ctypes.uint8_t.array(8) }
                    ]);
                    NOTIFYICONDATAW_TYPE = ctypes.StructType("NOTIFYICONDATAW", [
                        { cbSize: ctypes.uint32_t },
                        { hWnd: ctypes.voidptr_t },
                        { uID: ctypes.uint32_t },
                        { uFlags: ctypes.uint32_t },
                        { uCallbackMessage: ctypes.uint32_t },
                        { hIcon: ctypes.voidptr_t },
                        { szTip: ctypes.jschar.array(128) },
                        { dwState: ctypes.uint32_t },
                        { dwStateMask: ctypes.uint32_t },
                        { szInfo: ctypes.jschar.array(256) },
                        { uTimeoutOrVersion: ctypes.uint32_t },
                        { szInfoTitle: ctypes.jschar.array(64) },
                        { dwInfoFlags: ctypes.uint32_t },
                        { guidItem: GUID_TYPE },
                        { hBalloonIcon: ctypes.voidptr_t }
                    ]);
                    user32_ShowWindow = user32.declare("ShowWindow", ctypes.winapi_abi, ctypes.bool, ctypes.voidptr_t, ctypes.int32_t);
                    user32_SetForegroundWindow = user32.declare("SetForegroundWindow", ctypes.winapi_abi, ctypes.bool, ctypes.voidptr_t);
                    user32_FlashWindow = user32.declare("FlashWindow", ctypes.winapi_abi, ctypes.bool, ctypes.voidptr_t, ctypes.bool);
                    shell32_Shell_NotifyIconW = shell32.declare("Shell_NotifyIconW", ctypes.winapi_abi, ctypes.bool, ctypes.uint32_t, NOTIFYICONDATAW_TYPE.ptr);
                } catch(trayCtErr) {
                    logDebug("Optional Win32 window/tray ctypes init warning: " + trayCtErr);
                }
                logDebug("Win32 ctypes user32.dll, kernel32.dll, and shell32.dll initialized successfully.");
            }
        } catch(ctErr) {
            logDebug("ctypes init error: " + ctErr);
        }

        function getWindowHWND(chromeWin) {
            try {
                if (!ctypes || !chromeWin || !chromeWin.docShell || !chromeWin.docShell.treeOwner) return null;
                let baseWin = chromeWin.docShell.treeOwner.QueryInterface(Ci.nsIBaseWindow);
                let handleStr = baseWin.nativeHandle;
                if (!handleStr) return null;
                let decStr = String(BigInt(handleStr));
                return ctypes.voidptr_t(ctypes.UInt64(decStr));
            } catch(e) {
                logDebug("getWindowHWND error: " + e);
                return null;
            }
        }

        function applyWindowIcon(chromeWin) {
            try {
                if (!ctypes || !user32_LoadImageW || !user32_SendMessageW || !appRootDir) return;
                let hwnd = getWindowHWND(chromeWin);
                if (!hwnd) return;
                if (!cachedSmallIcon || !cachedBigIcon) {
                    let icoFile = appRootDir.clone();
                    icoFile.append("assets");
                    icoFile.append("branding");
                    icoFile.append("OpenPublisherV5.ico");
                    if (icoFile.exists()) {
                        // IMAGE_ICON = 1, LR_LOADFROMFILE = 0x0010
                        cachedSmallIcon = user32_LoadImageW(null, icoFile.path, 1, 16, 16, 0x0010);
                        cachedBigIcon = user32_LoadImageW(null, icoFile.path, 1, 48, 48, 0x0010);
                    }
                }
                // WM_SETICON = 0x0080, ICON_SMALL = 0, ICON_BIG = 1
                if (cachedSmallIcon && !cachedSmallIcon.isNull()) {
                    let lParamSmall = ctypes.cast(cachedSmallIcon, ctypes.intptr_t);
                    user32_SendMessageW(hwnd, 0x0080, 0, lParamSmall);
                }
                if (cachedBigIcon && !cachedBigIcon.isNull()) {
                    let lParamBig = ctypes.cast(cachedBigIcon, ctypes.intptr_t);
                    user32_SendMessageW(hwnd, 0x0080, 1, lParamBig);
                }
            } catch(icoErr) {
                logDebug("applyWindowIcon error: " + icoErr);
            }
        }

        try {
            let cs = Cc["@mozilla.org/consoleservice;1"].getService(Ci.nsIConsoleService);
            let consoleListener = {
                observe: function(msg) {
                    try {
                        if (!msg) return;
                        let text = msg.message;
                        try {
                            let scriptError = msg.QueryInterface(Ci.nsIScriptError);
                            if (scriptError && scriptError.errorMessage) {
                                text = "[ScriptError] " + scriptError.sourceName + ":" + scriptError.lineNumber + " " + scriptError.errorMessage;
                            }
                        } catch(se) {}
                        if (text && !text.includes("[DEBUG handleMouseMove") && !text.includes("e.target.closest is not a function") && (text.includes("OpenPublisher") || text.includes("Print") || text.includes("wrapper") || text.includes("Error") || text.includes("error") || text.includes("Security") || text.includes("Blocked") || text.includes("Gecko") || text.includes("shim"))) {
                            logDebug("[Console] " + text);
                        }
                    } catch(err) {}
                }
            };
            cs.registerListener(consoleListener);
        } catch(csErr) {
            logDebug("ConsoleService register error: " + csErr);
        }

        let wrapperUrl = "about:blank";
        try {
            if (appRootDir) {
                let wf = appRootDir.clone();
                wf.append("wrapper.html");
                wrapperUrl = Services.io.newFileURI(wf).spec;
            }
        } catch(wfErr) {
            logDebug("wrapperUrl resolve error: " + wfErr);
        }

        function detectOSRegionalLocale() {
            let raw = "";
            try {
                if (ctypes && kernel32_GetUserDefaultLocaleName) {
                    let bufType = ctypes.jschar.array(85);
                    let buf = bufType();
                    let len = kernel32_GetUserDefaultLocaleName(buf, 85);
                    if (len > 1) {
                        raw = String(buf.readString() || "").trim();
                    }
                }
            } catch(e1) {}
            if (!raw) {
                try {
                    let osp = Cc["@mozilla.org/intl/ospreferences;1"].getService(Ci.mozIOSPreferences);
                    if (osp && osp.regionalPrefsLocales && osp.regionalPrefsLocales.length > 0) {
                        raw = String(osp.regionalPrefsLocales[0] || "").trim();
                    }
                } catch(e2) {}
            }
            if (!raw) {
                try {
                    if (Services && Services.locale && Services.locale.regionalPrefsLocales && Services.locale.regionalPrefsLocales.length > 0) {
                        raw = String(Services.locale.regionalPrefsLocales[0] || "").trim();
                    }
                } catch(e3) {}
            }
            if (!raw) {
                try {
                    let osp2 = Cc["@mozilla.org/intl/ospreferences;1"].getService(Ci.mozIOSPreferences);
                    if (osp2 && osp2.systemLocale) {
                        raw = String(osp2.systemLocale || "").trim();
                    }
                } catch(e4) {}
            }
            let normalized = raw.replace(/_/g, "-").split("@")[0].trim();
            if (!/^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$/.test(normalized)) {
                normalized = "en-US";
            }
            let parts = normalized.split("-");
            let primary = parts[0].toLowerCase();
            let canonical = primary + (parts.length > 1 ? "-" + parts.slice(1).map(function(p) {
                return p.length === 2 ? p.toUpperCase() : p;
            }).join("-") : "");
            let langs = (canonical.toLowerCase() !== primary) ? [canonical, primary] : [canonical];
            return { locale: canonical, languages: langs };
        }
        const osLocaleInfo = detectOSRegionalLocale();
        logDebug("Detected OS Regional Locale: " + osLocaleInfo.locale + " (languages=" + JSON.stringify(osLocaleInfo.languages) + ")");

        // Lock essential preferences dynamically
        pref("intl.regional_prefs.use_os_locales", true);
        pref("intl.accept_languages", osLocaleInfo.languages.join(","));
        pref("browser.startup.page", 1);
        pref("browser.startup.homepage", wrapperUrl);
        pref("browser.newtab.url", wrapperUrl);
        pref("browser.newtabpage.enabled", false);
        pref("browser.tabs.warnOnClose", false);
        pref("browser.tabs.inTitlebar", 1);
        pref("browser.sessionstore.resume_from_crash", false);
        pref("browser.sessionstore.restore_on_demand", false);
        pref("toolkit.startup.max_resumed_crashes", -1);
        pref("toolkit.startup.recent_crashes", 0);
        pref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
        lockPref("app.update.auto", false);
        lockPref("app.update.enabled", false);
        lockPref("app.update.doorhanger", false);
        lockPref("app.update.badge", false);
        lockPref("app.update.service.enabled", false);
        lockPref("app.update.silent", true);
        lockPref("app.update.suppressPrompts", true);
        lockPref("alerts.useSystemBackend", false);
        lockPref("browser.uitour.enabled", false);
        lockPref("browser.uitour.url", "");
        lockPref("browser.vpn_promo.enabled", false);
        lockPref("browser.taskbar.lists.enabled", false);
        lockPref("browser.taskbar.lists.frequent.enabled", false);
        lockPref("browser.taskbar.lists.recent.enabled", false);
        lockPref("browser.taskbar.lists.tasks.enabled", false);
        lockPref("identity.fxaccounts.enabled", false);
        lockPref("network.cookie.cookieBehavior", 0);
        lockPref("privacy.partition.network_state", false);
        lockPref("privacy.partition.serviceWorkers", false);
        lockPref("dom.indexedDB.enabled", true);
        lockPref("security.sandbox.content.level", 0);
        lockPref("security.sandbox.windows.file.content.level", 0);
        lockPref("security.fileuri.strict_origin_policy", false);
        lockPref("privacy.file_unique_origin", false);
        lockPref("browser.tabs.remote.separateFileUriProcess", false);
        lockPref("browser.tabs.remote.useFileProcess", false);
        lockPref("fission.autostart", false);
        lockPref("network.file.path_blacklist", "");
        lockPref("browser.link.open_newwindow", 2);
        lockPref("browser.link.open_newwindow.restriction", 2);
        lockPref("dom.disable_open_during_load", false);
        lockPref("dom.popup_maximum", -1);
        lockPref("dom.allow_scripts_to_close_windows", true);
        lockPref("dom.disable_window_move_resize", false);
        lockPref("mousewheel.with_control.action", 0);
        pref("print.print_headerleft", "");
        pref("print.print_headercenter", "");
        pref("print.print_headerright", "");
        pref("print.print_footerleft", "");
        pref("print.print_footercenter", "");
        pref("print.print_footerright", "");
        pref("print.print_bgcolor", true);
        pref("print.print_bgimages", true);
        pref("print.print_margin_top", "0");
        pref("print.print_margin_bottom", "0");
        pref("print.print_margin_left", "0");
        pref("print.print_margin_right", "0");

        // Remove InvalidateCaches from compatibility.ini if present
        try {
            let profD = Services.dirsvc.get("ProfD", Ci.nsIFile);
            let compFile = profD.clone();
            compFile.append("compatibility.ini");
            if (compFile.exists()) {
                let fStream = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
                fStream.init(compFile, 0x01, 0, 0);
                let sis = Cc["@mozilla.org/scriptableinputstream;1"].createInstance(Ci.nsIScriptableInputStream);
                sis.init(fStream);
                let content = sis.read(fStream.available());
                sis.close();
                fStream.close();
                if (content.indexOf("InvalidateCaches=1") !== -1) {
                    content = content.replace("InvalidateCaches=1\r\n", "").replace("InvalidateCaches=1\n", "").replace("InvalidateCaches=1", "");
                    let foStream = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
                    foStream.init(compFile, 0x02 | 0x20, 0x1b6, 0);
                    foStream.write(content, content.length);
                    foStream.close();
                    logDebug("Removed InvalidateCaches from compatibility.ini");
                }
            }
        } catch(compErr) {
            logDebug("compatibility.ini check error: " + compErr);
        }

        // Register Global Parent MessageManager Listeners & FrameScript ONCE
        let globalMM = Services.mm;
        if (globalMM) {
            globalMM.addMessageListener("Gecko:Log", function(msg) {
                logDebug("[Content] " + msg.data.message);
            });

            globalMM.addMessageListener("Gecko:GetSystemPaths", function(msg) {
                try {
                    let homePath = "";
                    let tmpPath = "";
                    let deskPath = "";
                    let dataPath = "";
                    let launchFile = "";
                    try { homePath = Services.dirsvc.get("Home", Ci.nsIFile).path; } catch(e) {}
                    try { tmpPath = Services.dirsvc.get("TmpD", Ci.nsIFile).path; } catch(e) {}
                    try { deskPath = Services.dirsvc.get("Desk", Ci.nsIFile).path; } catch(e) {}
                    try {
                        let profD = Services.dirsvc.get("ProfD", Ci.nsIFile);
                        let ud = profD.clone();
                        ud.append("UserData");
                        if (!ud.exists()) {
                            ud.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
                        }
                        dataPath = ud.path;
                    } catch(e) {}
                    let firstRun = false;
                    let hostname = "localhost";
                    let localIp = "127.0.0.1";
                    try {
                        let env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
                        if (env.exists("OP_LAUNCH_FILE")) {
                            launchFile = env.get("OP_LAUNCH_FILE") || "";
                        }
                        if (env.exists("OP_FIRSTRUN") && env.get("OP_FIRSTRUN") === "1") {
                            firstRun = true;
                        }
                    } catch(e) {}
                    try {
                        let dns = Cc["@mozilla.org/network/dns-service;1"].getService(Ci.nsIDNSService);
                        if (dns && dns.myHostName) {
                            hostname = dns.myHostName;
                            let rec = dns.resolve(hostname, 0);
                            while (rec && rec.hasMore()) {
                                let addr = rec.getNextAddrAsString();
                                if (addr && addr.indexOf(":") === -1 && addr !== "127.0.0.1" && !addr.startsWith("169.254.")) {
                                    localIp = addr;
                                    break;
                                }
                            }
                        }
                    } catch(dnsErr) {}
                    return JSON.stringify({
                        appDir: appRootDir ? appRootDir.path : "",
                        homeDir: homePath,
                        tempDir: tmpPath,
                        desktopDir: deskPath,
                        dataDir: dataPath,
                        launchFile: launchFile,
                        firstRun: firstRun,
                        hostname: hostname,
                        localIp: localIp
                    });
                } catch(e) {
                    return "{}";
                }
            });

            globalMM.addMessageListener("Gecko:PickFile", function(msg) {
                if (isNativePickerOpen) {
                    logDebug("Gecko:PickFile ignored concurrent invocation while picker already active.");
                    return "";
                }
                isNativePickerOpen = true;
                try {
                    let opts = {};
                    try {
                        opts = (typeof msg.data === "string") ? JSON.parse(msg.data) : (msg.data || {});
                    } catch(pe) {}

                    let ownerWin = (msg.target && msg.target.ownerGlobal) ? msg.target.ownerGlobal : mainOPWindow;
                    if (!ownerWin) {
                        ownerWin = Services.wm.getMostRecentWindow("navigator:browser");
                    }
                    if (!ownerWin) return "";

                    let fp = Cc["@mozilla.org/filepicker;1"].createInstance(Ci.nsIFilePicker);
                    let modeStr = String(opts.mode || "open").toLowerCase();
                    let fpMode = Ci.nsIFilePicker.modeOpen;
                    let title = "Open Publication";
                    if (modeStr === "save") {
                        fpMode = Ci.nsIFilePicker.modeSave;
                        title = "Save Publication As";
                    } else if (modeStr === "folder") {
                        fpMode = Ci.nsIFilePicker.modeGetFolder;
                        title = "Select Folder";
                    }

                    fp.init(ownerWin, title, fpMode);

                    let defaultExt = "";
                    if (modeStr !== "folder") {
                        let accept = String(opts.accept || "").toLowerCase();
                        if (accept.includes(".opub")) {
                            fp.appendFilter("OpenPublisher Document (*.opub)", "*.opub");
                            defaultExt = "opub";
                        }
                        if (accept.includes(".json")) {
                            fp.appendFilter("JSON Document (*.json)", "*.json");
                            if (!defaultExt) defaultExt = "json";
                        }
                        if (accept && !accept.includes(".opub") && !accept.includes(".json")) {
                            let exts = accept.split(",").map(function(s) { return s.trim(); }).filter(function(s) { return s.startsWith("."); });
                            if (exts.length > 0) {
                                let pattern = exts.map(function(e) { return "*" + e; }).join("; ");
                                fp.appendFilter("Supported Files (" + pattern + ")", pattern);
                                defaultExt = exts[0].substring(1);
                            }
                        }
                        fp.appendFilters(Ci.nsIFilePicker.filterAll);
                        if (defaultExt) {
                            fp.defaultExtension = defaultExt;
                        }
                    }

                    if (opts.defaultName) {
                        let rawName = String(opts.defaultName).trim();
                        // Remove dirty-indicator asterisks ("Publication *.opub") & illegal Win32 filename characters
                        rawName = rawName.replace(/\s*\*(?=\.[^.]+$|$)/g, "").replace(/[<>:"/\\|?*\x00-\x1F]/g, "_").trim();
                        if (!rawName) rawName = defaultExt ? ("Publication." + defaultExt) : "Publication";
                        fp.defaultString = rawName;
                    }

                    try {
                        if (opts.workingDir) {
                            let wd = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
                            wd.initWithPath(String(opts.workingDir));
                            if (wd.exists() && wd.isDirectory()) {
                                fp.displayDirectory = wd;
                            }
                        } else if (lastPickedDir && lastPickedDir.exists()) {
                            fp.displayDirectory = lastPickedDir;
                        }
                    } catch(wdErr) {}

                    let chosenPath = "";
                    let pickerDone = false;
                    fp.open(function(rv) {
                        try {
                            if ((rv === Ci.nsIFilePicker.returnOK || rv === Ci.nsIFilePicker.returnReplace) && fp.file) {
                                chosenPath = fp.file.path;
                                try {
                                    if (fp.file.parent) lastPickedDir = fp.file.parent.clone();
                                } catch(pe2) {}
                            }
                        } catch(cbErr) {
                            logDebug("fp.open callback error: " + cbErr);
                        }
                        pickerDone = true;
                    });

                    Services.tm.spinEventLoopUntil("OpenPublisher:PickFile", function() {
                        return pickerDone;
                    });

                    if (chosenPath && modeStr === "save" && defaultExt) {
                        let leaf = chosenPath.split(/[\\/]/).pop() || "";
                        if (leaf.indexOf(".") === -1) {
                            chosenPath += "." + defaultExt;
                        }
                    }

                    logDebug("Gecko:PickFile (" + modeStr + ") -> " + (chosenPath || "[cancelled]"));
                    return chosenPath;
                } catch(err) {
                    logDebug("Gecko:PickFile error: " + err);
                    return "";
                } finally {
                    isNativePickerOpen = false;
                }
            });

            globalMM.addMessageListener("Gecko:FsOp", function(msg) {
                try {
                    let req = (typeof msg.data === "string") ? JSON.parse(msg.data) : (msg.data || {});
                    let op = req.op || "";
                    let p = String(req.path || "");
                    if (!p) return JSON.stringify({ ok: false, err: "Empty path" });

                    let f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
                    f.initWithPath(p);

                    if (op === "exists") {
                        return JSON.stringify({ ok: true, exists: f.exists() });
                    }
                    if (op === "stat") {
                        if (!f.exists()) return JSON.stringify({ ok: false, err: "ENOENT" });
                        let isDir = f.isDirectory();
                        let isFile = f.isFile();
                        return JSON.stringify({
                            ok: true,
                            isFile: isFile,
                            isDirectory: isDir,
                            size: isFile ? f.fileSize : 0,
                            mtimeMs: f.lastModifiedTime || Date.now()
                        });
                    }
                    if (op === "mkdir") {
                        if (!f.exists()) {
                            f.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
                        }
                        return JSON.stringify({ ok: true });
                    }
                    if (op === "readdir") {
                        if (!f.exists() || !f.isDirectory()) {
                            return JSON.stringify({ ok: true, entries: [] });
                        }
                        let entries = f.directoryEntries;
                        let names = [];
                        while (entries.hasMoreElements()) {
                            let entry = entries.nextFile ? entries.nextFile : entries.getNext().QueryInterface(Ci.nsIFile);
                            if (entry && entry.leafName) names.push(entry.leafName);
                        }
                        return JSON.stringify({ ok: true, entries: names });
                    }
                    if (op === "readFile") {
                        if (!f.exists() || f.isDirectory()) {
                            return JSON.stringify({ ok: false, err: "ENOENT" });
                        }
                        let fiStream = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
                        fiStream.init(f, 0x01, 0, 0);
                        let bis = Cc["@mozilla.org/binaryinputstream;1"].createInstance(Ci.nsIBinaryInputStream);
                        bis.setInputStream(fiStream);
                        let chunks = [];
                        let avail = 0;
                        while ((avail = bis.available()) > 0) {
                            chunks.push(bis.readBytes(avail));
                        }
                        bis.close();
                        fiStream.close();
                        let b64 = encodeB64Bytes(chunks.join(""));
                        return JSON.stringify({ ok: true, b64: b64 });
                    }
                    if (op === "writeFile" || op === "appendFile") {
                        if (f.parent && !f.parent.exists()) {
                            f.parent.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
                        }
                        let binStr = decodeB64Bytes(req.b64 || "");
                        let flags = (op === "appendFile") ? (0x02 | 0x08 | 0x10) : (0x02 | 0x08 | 0x20);
                        let foStream = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
                        foStream.init(f, flags, 0o666, 0);
                        let bos = Cc["@mozilla.org/binaryoutputstream;1"].createInstance(Ci.nsIBinaryOutputStream);
                        bos.setOutputStream(foStream);
                        if (binStr.length > 0) {
                            bos.writeBytes(binStr, binStr.length);
                        }
                        bos.close();
                        foStream.close();
                        return JSON.stringify({ ok: true });
                    }
                    if (op === "unlink") {
                        if (f.exists()) {
                            f.remove(false);
                        }
                        return JSON.stringify({ ok: true });
                    }
                    if (op === "copyFile") {
                        if (!f.exists()) return JSON.stringify({ ok: false, err: "ENOENT" });
                        let dst = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
                        dst.initWithPath(String(req.path2 || ""));
                        if (dst.parent && !dst.parent.exists()) {
                            dst.parent.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
                        }
                        if (dst.exists() && p.toLowerCase() !== dst.path.toLowerCase()) {
                            dst.remove(false);
                        }
                        if (p.toLowerCase() !== dst.path.toLowerCase()) {
                            f.copyTo(dst.parent, dst.leafName);
                        }
                        return JSON.stringify({ ok: true });
                    }
                    if (op === "rename") {
                        if (!f.exists()) return JSON.stringify({ ok: false, err: "ENOENT" });
                        let dst = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
                        dst.initWithPath(String(req.path2 || ""));
                        if (dst.parent && !dst.parent.exists()) {
                            dst.parent.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
                        }
                        if (dst.exists() && p.toLowerCase() !== dst.path.toLowerCase()) {
                            dst.remove(false);
                        }
                        if (p.toLowerCase() !== dst.path.toLowerCase()) {
                            f.moveTo(dst.parent, dst.leafName);
                        }
                        return JSON.stringify({ ok: true });
                    }
                    return JSON.stringify({ ok: false, err: "Unsupported op: " + op });
                } catch(fsErr) {
                    logDebug("Gecko:FsOp error (" + (msg.data ? msg.data : "") + "): " + fsErr);
                    return JSON.stringify({ ok: false, err: String(fsErr) });
                }
            });

            globalMM.addMessageListener("Gecko:PrintFrame", function(msg) {
                try {
                    let bcId = msg.data ? Number(msg.data.browsingContextId) : 0;
                    let targetWin = (msg.target && msg.target.ownerGlobal) ? msg.target.ownerGlobal : mainOPWindow;
                    if (!targetWin) targetWin = Services.wm.getMostRecentWindow("navigator:browser");
                    logDebug("Gecko:PrintFrame requested for browsingContextId=" + bcId);

                    function findBCById(rootBC, wantId) {
                        if (!rootBC || !wantId) return null;
                        if (rootBC.id === wantId) return rootBC;
                        let kids = rootBC.children || [];
                        for (let i = 0; i < kids.length; i++) {
                            let found = findBCById(kids[i], wantId);
                            if (found) return found;
                        }
                        return null;
                    }

                    let bc = null;
                    if (bcId) {
                        let bcClass = (targetWin && targetWin.CanonicalBrowsingContext) ? targetWin.CanonicalBrowsingContext
                                    : ((targetWin && targetWin.BrowsingContext) ? targetWin.BrowsingContext
                                    : ((typeof CanonicalBrowsingContext !== "undefined") ? CanonicalBrowsingContext
                                    : ((typeof BrowsingContext !== "undefined") ? BrowsingContext : null)));
                        if (bcClass && typeof bcClass.get === "function") {
                            try { bc = bcClass.get(bcId); } catch(ge) {}
                        }
                        if (!bc && targetWin && targetWin.gBrowser && targetWin.gBrowser.selectedBrowser) {
                            try { bc = findBCById(targetWin.gBrowser.selectedBrowser.browsingContext, bcId); } catch(fe) {}
                        }
                    }

                    if (targetWin && targetWin.PrintUtils && bc) {
                        let sourceBrowser = (bc.top && bc.top.embedderElement) ? bc.top.embedderElement : targetWin.gBrowser.selectedBrowser;
                        let existingPreview = null;
                        try {
                            existingPreview = targetWin.PrintUtils.getPreviewBrowser(sourceBrowser);
                        } catch(epErr) {}

                        if (!existingPreview) {
                            targetWin.PrintUtils.startPrintWindow(bc, { printFrameOnly: true });
                            logDebug("PrintUtils.startPrintWindow invoked successfully for bcId=" + bcId);
                        } else {
                            logDebug("PrintPreview already active; reusing open dialog.");
                        }

                        // Keep .op-print-frame alive until the TabModal Print Preview dialog closes
                        let checks = 0;
                        let waitTimer = targetWin.setInterval(function() {
                            checks++;
                            try {
                                if (targetWin.closed) {
                                    targetWin.clearInterval(waitTimer);
                                    return;
                                }
                                let openDialogs = 0;
                                try {
                                    let dbox = targetWin.PrintUtils.getTabDialogBox(sourceBrowser);
                                    if (dbox && dbox.getTabDialogManager) {
                                        let mgr = dbox.getTabDialogManager();
                                        if (mgr && mgr._dialogs) openDialogs = mgr._dialogs.length;
                                    }
                                } catch(dbErr) {}

                                if (checks >= 2 && openDialogs === 0) {
                                    targetWin.clearInterval(waitTimer);
                                    logDebug("Print Preview dialog closed; signalling Gecko:PrintDone.");
                                    try { globalMM.broadcastAsyncMessage("Gecko:PrintDone", {}); } catch(e) {}
                                }
                            } catch(pollErr) {
                                targetWin.clearInterval(waitTimer);
                                try { globalMM.broadcastAsyncMessage("Gecko:PrintDone", {}); } catch(e) {}
                            }
                        }, 250);
                    } else {
                        logDebug("PrintUtils or BrowsingContext unavailable (bcId=" + bcId + "); signalling fallback.");
                        globalMM.broadcastAsyncMessage("Gecko:PrintDone", { fallback: true });
                    }
                } catch(prErr) {
                    logDebug("Gecko:PrintFrame exception: " + prErr);
                    try { globalMM.broadcastAsyncMessage("Gecko:PrintDone", { fallback: true }); } catch(e) {}
                }
            });

            globalMM.addMessageListener("Gecko:QueueChildWindow", function(msg) {
                try {
                    if (msg.data && msg.data.url) {
                        pendingChildSpecs.push({
                            url: String(msg.data.url),
                            w: Number(msg.data.w) || 840,
                            h: Number(msg.data.h) || 640,
                            left: Number(msg.data.left) || 100,
                            top: Number(msg.data.top) || 100,
                            alwaysOnTop: Boolean(msg.data.alwaysOnTop),
                            ts: Date.now()
                        });
                    }
                } catch(e) {}
                return true;
            });

            // Native TCP HTTP Server for Broadcast to Classroom (nsIServerSocket)
            let httpServerSockets = new Map();
            let httpActiveRequests = new Map();
            let httpReqCounter = 0;

            globalMM.addMessageListener("Gecko:HttpListen", function(msg) {
                try {
                    let req = (typeof msg.data === "string") ? JSON.parse(msg.data) : (msg.data || {});
                    let serverId = Number(req.serverId || 1);
                    let port = Number(req.port || 3000);
                    let srvSock = Cc["@mozilla.org/network/server-socket;1"].createInstance(Ci.nsIServerSocket);
                    srvSock.init(port, false, -1);
                    httpServerSockets.set(serverId, srvSock);

                    srvSock.asyncListen({
                        onSocketAccepted: function(serv, transport) {
                            try {
                                let inStream = transport.openInputStream(0, 0, 0).QueryInterface(Ci.nsIAsyncInputStream);
                                let outStream = transport.openOutputStream(0, 0, 0);
                                let reqId = ++httpReqCounter;
                                httpActiveRequests.set(reqId, { outStream: outStream, inStream: inStream, transport: transport });

                                let rawBuf = "";
                                let headersParsed = false;
                                let reader = {
                                    onInputStreamReady: function(stream) {
                                        try {
                                            let avail = 0;
                                            try { avail = stream.available(); } catch(ae) {
                                                // Socket closed by client
                                                httpActiveRequests.delete(reqId);
                                                globalMM.broadcastAsyncMessage("Gecko:ToWrapper", { type: "http_close", reqId: reqId });
                                                return;
                                            }
                                            if (avail > 0) {
                                                let sis = Cc["@mozilla.org/scriptableinputstream;1"].createInstance(Ci.nsIScriptableInputStream);
                                                sis.init(stream);
                                                rawBuf += sis.read(avail);
                                                if (!headersParsed && rawBuf.indexOf("\r\n\r\n") !== -1) {
                                                    headersParsed = true;
                                                    let lines = rawBuf.split("\r\n");
                                                    let firstLine = (lines[0] || "GET / HTTP/1.1").split(" ");
                                                    let method = firstLine[0] || "GET";
                                                    let url = firstLine[1] || "/";
                                                    let hdrs = {};
                                                    for (let i = 1; i < lines.length; i++) {
                                                        if (!lines[i]) break;
                                                        let cIdx = lines[i].indexOf(":");
                                                        if (cIdx > 0) {
                                                            hdrs[lines[i].substring(0, cIdx).trim().toLowerCase()] = lines[i].substring(cIdx + 1).trim();
                                                        }
                                                    }
                                                    globalMM.broadcastAsyncMessage("Gecko:ToWrapper", {
                                                        type: "http_request",
                                                        serverId: serverId,
                                                        reqId: reqId,
                                                        method: method,
                                                        url: url,
                                                        headers: hdrs
                                                    });
                                                }
                                            }
                                            stream.asyncWait(reader, 0, 0, Services.tm.mainThread);
                                        } catch(re) {
                                            httpActiveRequests.delete(reqId);
                                            globalMM.broadcastAsyncMessage("Gecko:ToWrapper", { type: "http_close", reqId: reqId });
                                        }
                                    }
                                };
                                inStream.asyncWait(reader, 0, 0, Services.tm.mainThread);
                            } catch(accErr) {
                                logDebug("HTTP onSocketAccepted error: " + accErr);
                            }
                        },
                        onStopListening: function(serv, status) {}
                    });
                    logDebug("Broadcast HTTP Server listening on port " + port + " (serverId=" + serverId + ")");
                    return JSON.stringify({ ok: true, port: port });
                } catch(listenErr) {
                    return JSON.stringify({ ok: false, error: String(listenErr) });
                }
            });

            globalMM.addMessageListener("Gecko:HttpWrite", function(msg) {
                try {
                    let req = (typeof msg.data === "string") ? JSON.parse(msg.data) : (msg.data || {});
                    let reqId = Number(req.reqId || 0);
                    let entry = httpActiveRequests.get(reqId);
                    if (!entry || !entry.outStream) return JSON.stringify({ ok: false });
                    let dataStr = String(req.data || "");
                    if (dataStr.length > 0) {
                        let conv = Cc["@mozilla.org/intl/scriptableunicodeconverter"].createInstance(Ci.nsIScriptableUnicodeConverter);
                        conv.charset = "UTF-8";
                        let byteArr = conv.convertToByteArray(dataStr, {});
                        let bos = Cc["@mozilla.org/binaryoutputstream;1"].createInstance(Ci.nsIBinaryOutputStream);
                        bos.setOutputStream(entry.outStream);
                        bos.writeByteArray(byteArr, byteArr.length);
                        entry.outStream.flush();
                    }
                    if (req.close) {
                        httpActiveRequests.delete(reqId);
                        try { entry.outStream.close(); } catch(ce) {}
                        try { entry.inStream.close(); } catch(ce2) {}
                    }
                    return JSON.stringify({ ok: true });
                } catch(writeErr) {
                    let req = (typeof msg.data === "string") ? JSON.parse(msg.data) : (msg.data || {});
                    if (req && req.reqId) httpActiveRequests.delete(Number(req.reqId));
                    return JSON.stringify({ ok: false, error: String(writeErr) });
                }
            });

            globalMM.addMessageListener("Gecko:HttpClose", function(msg) {
                try {
                    let req = (typeof msg.data === "string") ? JSON.parse(msg.data) : (msg.data || {});
                    let serverId = Number(req.serverId || 0);
                    let srvSock = httpServerSockets.get(serverId);
                    if (srvSock) {
                        httpServerSockets.delete(serverId);
                        try { srvSock.close(); } catch(ce) {}
                    }
                    for (let [rId, entry] of httpActiveRequests.entries()) {
                        try { if (entry.outStream) entry.outStream.close(); } catch(e) {}
                        try { if (entry.inStream) entry.inStream.close(); } catch(e) {}
                    }
                    httpActiveRequests.clear();
                    logDebug("Broadcast HTTP Server closed (serverId=" + serverId + ")");
                } catch(closeErr) {}
                return JSON.stringify({ ok: true });
            });

            function performToggleMaximize(win) {
                let now = Date.now();
                if (now - (win.__lastToggleMaxTime || 0) < 500) return;
                win.__lastToggleMaxTime = now;
                win.__lastDragClickTime = 0;
                if (win.windowState === win.STATE_MAXIMIZED) {
                    if (typeof win.restore === "function") win.restore();
                    else win.windowState = win.STATE_NORMAL;
                } else {
                    if (typeof win.maximize === "function") win.maximize();
                    else win.windowState = win.STATE_MAXIMIZED;
                }
            }

            globalMM.addMessageListener("Gecko:Window", function(msg) {
                let action = msg.data ? msg.data.action : "";
                let targetWin = (msg.target && msg.target.ownerGlobal) ? msg.target.ownerGlobal : mainOPWindow;
                if (!targetWin) return;

                try {
                    if (action === "startDrag") {
                        if (targetWin.fullScreen) return;
                        let now = Date.now();
                        let prevTime = targetWin.__lastDragClickTime || 0;
                        let prevX = (typeof targetWin.__lastDragWinX === "number") ? targetWin.__lastDragWinX : -99999;
                        let prevY = (typeof targetWin.__lastDragWinY === "number") ? targetWin.__lastDragWinY : -99999;
                        let curX = targetWin.screenX || 0;
                        let curY = targetWin.screenY || 0;
                        let isMax = (targetWin.windowState === targetWin.STATE_MAXIMIZED);
                        let moved = !isMax && (Math.abs(curX - prevX) > 8 || Math.abs(curY - prevY) > 8);

                        if ((now - prevTime) < 450 && !moved) {
                            performToggleMaximize(targetWin);
                            return;
                        }

                        targetWin.__lastDragClickTime = now;
                        targetWin.__lastDragWinX = curX;
                        targetWin.__lastDragWinY = curY;

                        // Do not enter Win32 caption drag loop when maximized; keep title bar responsive for double-click restore
                        if (isMax) return;

                        let hwnd = getWindowHWND(targetWin);
                        if (hwnd && user32_ReleaseCapture && user32_SendMessageW) {
                            targetWin.setTimeout(function() {
                                try {
                                    user32_ReleaseCapture();
                                    // WM_NCLBUTTONDOWN (0x00A1), HTCAPTION (2)
                                    user32_SendMessageW(hwnd, 0x00A1, 2, 0);
                                } catch(dragErr) {
                                    logDebug("Win32 startDrag error: " + dragErr);
                                }
                            }, 0);
                        }
                    }
                    else if (action === "toggleMaximize") {
                        performToggleMaximize(targetWin);
                    }
                    else if (action === "minimize") {
                        if (typeof targetWin.minimize === "function") targetWin.minimize();
                        else targetWin.windowState = targetWin.STATE_MINIMIZED;
                    }
                    else if (action === "maximize") {
                        if (typeof targetWin.maximize === "function") targetWin.maximize();
                        else targetWin.windowState = targetWin.STATE_MAXIMIZED;
                    }
                    else if (action === "restore" || action === "unmaximize") {
                        let hwnd = getWindowHWND(targetWin);
                        if (hwnd && user32_ShowWindow) {
                            user32_ShowWindow(hwnd, 9); // SW_RESTORE
                        }
                        if (typeof targetWin.restore === "function") targetWin.restore();
                        else targetWin.windowState = targetWin.STATE_NORMAL;
                    }
                    else if (action === "hide") {
                        let hwnd = getWindowHWND(targetWin);
                        if (hwnd && user32_ShowWindow) {
                            user32_ShowWindow(hwnd, 0); // SW_HIDE
                        } else if (typeof targetWin.minimize === "function") {
                            targetWin.minimize();
                        }
                    }
                    else if (action === "show") {
                        let hwnd = getWindowHWND(targetWin);
                        if (hwnd && user32_ShowWindow) {
                            user32_ShowWindow(hwnd, 5); // SW_SHOW
                            if (user32_SetForegroundWindow) user32_SetForegroundWindow(hwnd);
                        }
                        if (typeof targetWin.focus === "function") targetWin.focus();
                    }
                    else if (action === "focus") {
                        let hwnd = getWindowHWND(targetWin);
                        if (hwnd && user32_SetForegroundWindow) {
                            user32_SetForegroundWindow(hwnd);
                        }
                        if (typeof targetWin.focus === "function") targetWin.focus();
                    }
                    else if (action === "requestAttention") {
                        let hwnd = getWindowHWND(targetWin);
                        if (hwnd && user32_FlashWindow) {
                            user32_FlashWindow(hwnd, Boolean(msg.data ? msg.data.value : true));
                        }
                    }
                    else if (action === "quit") {
                        logDebug("Gecko:Window quit requested.");
                        try {
                            let appStartup = Cc["@mozilla.org/toolkit/app-startup;1"].getService(Ci.nsIAppStartup);
                            appStartup.quit(Ci.nsIAppStartup.eForceQuit);
                        } catch(e2) {
                            try { if (mainOPWindow) mainOPWindow.close(); } catch(e) {}
                        }
                    }
                    else if (action === "close") {
                        let isMain = (targetWin === mainOPWindow);
                        logDebug("Gecko:Window close requested (isMain=" + isMain + ").");
                        if (isMain) {
                            try {
                                let appStartup = Cc["@mozilla.org/toolkit/app-startup;1"].getService(Ci.nsIAppStartup);
                                appStartup.quit(Ci.nsIAppStartup.eForceQuit);
                            } catch(e2) {
                                try { targetWin.close(); } catch(e) {}
                            }
                        } else {
                            try { targetWin.close(); } catch(e) {}
                        }
                    }
                    else if (action === "alwaysontop") {
                        let val = Boolean(msg.data.value);
                        let hwnd = getWindowHWND(targetWin);
                        if (hwnd && user32_SetWindowPos && ctypes) {
                            // HWND_TOPMOST = -1, HWND_NOTOPMOST = -2, SWP_NOMOVE|SWP_NOSIZE|SWP_NOACTIVATE = 0x0013
                            let insertAfter = ctypes.voidptr_t(ctypes.Int64(val ? -1 : -2));
                            user32_SetWindowPos(hwnd, insertAfter, 0, 0, 0, 0, 0x0013);
                        } else {
                            try {
                                let targetOwner = targetWin.docShell.treeOwner;
                                let xulWin = targetOwner.getInterface ? targetOwner.getInterface(Ci.nsIXULWindow) : targetOwner.QueryInterface(Ci.nsIXULWindow);
                                xulWin.zLevel = val ? Ci.nsIXULWindow.raisedZ : Ci.nsIXULWindow.normalZ;
                            } catch(e) {
                                logDebug("alwaysontop fallback error: " + e);
                            }
                        }
                    }
                    else if (action === "moveTo") {
                        let x = Number(msg.data.x);
                        let y = Number(msg.data.y);
                        if (!Number.isNaN(x) && !Number.isNaN(y)) {
                            targetWin.moveTo(Math.round(x), Math.round(y));
                        }
                    }
                    else if (action === "resizeTo") {
                        let w = Number(msg.data.w);
                        let h = Number(msg.data.h);
                        if (w > 0 && h > 0) {
                            targetWin.resizeTo(Math.round(w), Math.round(h));
                        }
                    }
                } catch(winErr) {
                    logDebug("Gecko:Window error (" + action + "): " + winErr);
                }
            });

            function openExternalUrl(rawUrl) {
                try {
                    let u = String(rawUrl || "").trim();
                    if (!u || (!u.startsWith("http://") && !u.startsWith("https://") && !u.startsWith("mailto:"))) return false;
                    if (shell32_ShellExecuteW) {
                        // SW_SHOWNORMAL = 1; launches URL directly in the user's Windows default browser
                        shell32_ShellExecuteW(null, "open", u, null, null, 1);
                        logDebug("Opened external URL via Win32 ShellExecuteW: " + u);
                        return true;
                    }
                    let uri = Services.io.newURI(u);
                    let extProto = Cc["@mozilla.org/uriloader/external-protocol-service;1"].getService(Ci.nsIExternalProtocolService);
                    extProto.loadURI(uri);
                    logDebug("Opened external URL via nsIExternalProtocolService: " + u);
                    return true;
                } catch(extErr) {
                    logDebug("openExternalUrl error: " + extErr);
                    return false;
                }
            }

