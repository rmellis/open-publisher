            globalMM.addMessageListener("Gecko:GuestLoaded", function(msg) {
                try {
                    globalMM.broadcastAsyncMessage("Gecko:ToWrapper", { type: "contentload" });
                } catch(e) {}
            });

            let _wrapperUpdateInFlight = false;
            globalMM.addMessageListener("Gecko:CheckWrapperUpdate", function(msg) {
                if (_wrapperUpdateInFlight) return;
                _wrapperUpdateInFlight = true;
                const finishStatus = function(payload) {
                    try {
                        globalMM.broadcastAsyncMessage("Gecko:ToWrapper", Object.assign({
                            source: "openpublisher-host",
                            type: "OP_WRAPPER_UPDATE_STATUS"
                        }, payload));
                    } catch(e) {}
                };
                const done = function(st) {
                    _wrapperUpdateInFlight = false;
                    finishStatus(st);
                };
                try {
                    const data = msg.data || {};
                    const manifestUrl = String(data.url || "");
                    const localHref = String(data.localHref || "");
                    let localVersion = Number(data.localVersion || 0);

                    if (!manifestUrl.startsWith("https://") || !localHref.startsWith("file://")) {
                        done({ status: "uptodate" });
                        return;
                    }

                    const localWrapperFile = Services.io.newURI(localHref).QueryInterface(Ci.nsIFileURL).file;
                    const appRootDir = localWrapperFile ? localWrapperFile.parent : null;
                    if (!appRootDir || !appRootDir.exists() || !appRootDir.isDirectory()) {
                        done({ status: "uptodate" });
                        return;
                    }

                    const resolveAppRelFile = function(relPath) {
                        const clean = String(relPath || "").replace(/\\/g, "/").replace(/^\/+/, "");
                        if (!clean || clean.includes("..") || clean.includes(":")) return null;
                        const parts = clean.split("/").filter(Boolean);
                        if (parts.length === 0) return null;
                        const f = appRootDir.clone();
                        for (let i = 0; i < parts.length; i++) {
                            f.append(parts[i]);
                        }
                        return f;
                    };

                    const sha256Hex = function(uint8Arr) {
                        const hasher = Cc["@mozilla.org/security/hash;1"].createInstance(Ci.nsICryptoHash);
                        hasher.init(Ci.nsICryptoHash.SHA256);
                        hasher.update(uint8Arr, uint8Arr.length);
                        const bin = hasher.finish(false);
                        let hex = "";
                        for (let i = 0; i < bin.length; i++) {
                            hex += ("0" + bin.charCodeAt(i).toString(16)).slice(-2);
                        }
                        return hex;
                    };

                    const readFileUint8 = function(f) {
                        const fi = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
                        fi.init(f, 0x01, 0, 0);
                        const bis = Cc["@mozilla.org/binaryinputstream;1"].createInstance(Ci.nsIBinaryInputStream);
                        bis.setInputStream(fi);
                        const arr = bis.readByteArray(f.fileSize);
                        bis.close();
                        fi.close();
                        return new Uint8Array(arr);
                    };

                    const writeAtomic = function(targetFile, uint8Arr) {
                        if (targetFile.parent && !targetFile.parent.exists()) {
                            targetFile.parent.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
                        }
                        const tmpFile = targetFile.parent.clone();
                        tmpFile.append(targetFile.leafName + ".tmp");
                        if (tmpFile.exists()) tmpFile.remove(false);
                        const fo = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
                        fo.init(tmpFile, 0x02 | 0x08 | 0x20, 0o666, 0);
                        const bos = Cc["@mozilla.org/binaryoutputstream;1"].createInstance(Ci.nsIBinaryOutputStream);
                        bos.setOutputStream(fo);
                        const byteArr = Array.from(uint8Arr);
                        bos.writeByteArray(byteArr, byteArr.length);
                        bos.close();
                        fo.close();
                        if (targetFile.exists()) targetFile.remove(false);
                        tmpFile.moveTo(targetFile.parent, targetFile.leafName);
                    };

                    const XHRCtor = (typeof XMLHttpRequest === "function")
                        ? XMLHttpRequest
                        : (Services.appShell && Services.appShell.hiddenDOMWindow && Services.appShell.hiddenDOMWindow.XMLHttpRequest);
                    if (typeof XHRCtor !== "function") {
                        logDebug("Gecko:CheckWrapperUpdate aborted: XMLHttpRequest unavailable");
                        done({ status: "uptodate" });
                        return;
                    }

                    const localManifestFile = resolveAppRelFile("manifest.json");
                    if (localManifestFile && localManifestFile.exists() && localManifestFile.isFile()) {
                        try {
                            const lmObj = JSON.parse(new TextDecoder("utf-8").decode(readFileUint8(localManifestFile)));
                            if (lmObj && Number(lmObj.version) > localVersion) {
                                localVersion = Number(lmObj.version);
                            }
                        } catch(e) {}
                    }

                    const baseUrl = manifestUrl.substring(0, manifestUrl.lastIndexOf("/") + 1);
                    const mXhr = new XHRCtor();
                    mXhr.open("GET", manifestUrl, true);
                    mXhr.setRequestHeader("Cache-Control", "no-cache, no-store");
                    mXhr.timeout = 5000;
                    mXhr.onerror = function() { logDebug("Manifest XHR error"); done({ status: "uptodate" }); };
                    mXhr.ontimeout = function() { logDebug("Manifest XHR timeout"); done({ status: "uptodate" }); };
                    mXhr.onload = function() {
                        try {
                            if (mXhr.status < 200 || mXhr.status >= 300 || !mXhr.responseText) {
                                done({ status: "uptodate" });
                                return;
                            }
                            const remoteManifest = JSON.parse(mXhr.responseText);
                            const remoteVersion = Number(remoteManifest && remoteManifest.version || 0);
                            const filesObj = (remoteManifest && remoteManifest.files && typeof remoteManifest.files === "object")
                                ? remoteManifest.files
                                : null;
                            if (!filesObj || (remoteVersion > 0 && localVersion > 0 && remoteVersion < localVersion)) {
                                done({ status: "uptodate" });
                                return;
                            }

                            const queue = [];
                            const keys = Object.keys(filesObj);
                            for (let i = 0; i < keys.length; i++) {
                                const rel = keys[i];
                                const entry = filesObj[rel] || {};
                                const targetFile = resolveAppRelFile(rel);
                                if (!targetFile) continue;
                                const expectedHash = String(entry.sha256 || "").trim().toLowerCase();
                                let needsUpdate = false;
                                if (!targetFile.exists() || !targetFile.isFile()) {
                                    needsUpdate = true;
                                } else if (expectedHash) {
                                    const curHash = sha256Hex(readFileUint8(targetFile));
                                    if (curHash !== expectedHash) needsUpdate = true;
                                } else if (remoteVersion > localVersion) {
                                    needsUpdate = true;
                                }
                                if (needsUpdate) {
                                    const rawEntryUrl = String(entry.url || rel).replace(/\\/g, "/").replace(/^\/+/, "");
                                    const fullUrl = rawEntryUrl.startsWith("https://") ? rawEntryUrl : (baseUrl + rawEntryUrl);
                                    queue.push({ rel: rel, url: fullUrl, targetFile: targetFile, expectedHash: expectedHash });
                                }
                            }

                            if (queue.length === 0) {
                                done({ status: "uptodate" });
                                return;
                            }

                            const downloaded = [];
                            let idx = 0;
                            const downloadNext = function() {
                                if (idx >= queue.length) {
                                    let needsReload = false;
                                    for (let k = 0; k < downloaded.length; k++) {
                                        const item = downloaded[k];
                                        writeAtomic(item.targetFile, item.bytes);
                                        logDebug("Updated app file: " + item.rel + " (" + item.bytes.length + " bytes)");
                                        if (item.rel !== "firefox/core/firefox.cfg") {
                                            needsReload = true;
                                        }
                                    }
                                    if (localManifestFile) {
                                        try {
                                            const manifestBytes = new TextEncoder("utf-8").encode(JSON.stringify(remoteManifest, null, 2) + "\n");
                                            writeAtomic(localManifestFile, manifestBytes);
                                        } catch(e) {}
                                    }
                                    if (needsReload) {
                                        done({ status: "reloading", version: remoteVersion });
                                    } else {
                                        done({ status: "uptodate" });
                                    }
                                    return;
                                }

                                const item = queue[idx];
                                const basePct = Math.round((idx / queue.length) * 100);
                                finishStatus({
                                    status: "downloading",
                                    file: item.rel,
                                    index: idx + 1,
                                    totalFiles: queue.length,
                                    percent: Math.max(5, basePct)
                                });

                                const fXhr = new XHRCtor();
                                fXhr.open("GET", item.url, true);
                                fXhr.responseType = "arraybuffer";
                                fXhr.setRequestHeader("Cache-Control", "no-cache, no-store");
                                fXhr.timeout = 15000;
                                fXhr.onprogress = function(ev) {
                                    const step = (ev.lengthComputable && ev.total > 0) ? (ev.loaded / ev.total) : 0.5;
                                    const pct = Math.min(98, Math.max(5, Math.round(((idx + step) / queue.length) * 100)));
                                    finishStatus({
                                        status: "downloading",
                                        file: item.rel,
                                        index: idx + 1,
                                        totalFiles: queue.length,
                                        loaded: ev.loaded,
                                        total: ev.lengthComputable ? ev.total : 0,
                                        percent: pct
                                    });
                                };
                                fXhr.onerror = function() { logDebug("File XHR error: " + item.rel); done({ status: "uptodate" }); };
                                fXhr.ontimeout = function() { logDebug("File XHR timeout: " + item.rel); done({ status: "uptodate" }); };
                                fXhr.onload = function() {
                                    try {
                                        if (fXhr.status < 200 || fXhr.status >= 300 || !fXhr.response) {
                                            done({ status: "uptodate" });
                                            return;
                                        }
                                        const bytes = new Uint8Array(fXhr.response);
                                        if (bytes.length === 0) {
                                            done({ status: "uptodate" });
                                            return;
                                        }
                                        if (item.expectedHash && sha256Hex(bytes) !== item.expectedHash) {
                                            logDebug("Update hash mismatch for " + item.rel + "; aborting update");
                                            done({ status: "uptodate" });
                                            return;
                                        }
                                        if (item.rel === "wrapper.html") {
                                            const txt = new TextDecoder("utf-8").decode(bytes);
                                            if (txt.length < 50000 || !/<!doctype\s+html>/i.test(txt) ||
                                                txt.indexOf('id="app-view"') === -1 || txt.indexOf("</html>") === -1) {
                                                done({ status: "uptodate" });
                                                return;
                                            }
                                        }
                                        downloaded.push({ rel: item.rel, targetFile: item.targetFile, bytes: bytes });
                                        idx++;
                                        downloadNext();
                                    } catch(fErr) {
                                        logDebug("Update file check error (" + item.rel + "): " + fErr);
                                        done({ status: "uptodate" });
                                    }
                                };
                                fXhr.send();
                            };
                            downloadNext();
                        } catch(mErr) {
                            logDebug("Manifest parse/update error: " + mErr);
                            done({ status: "uptodate" });
                        }
                    };
                    mXhr.send();
                } catch(updErr) {
                    logDebug("Gecko:CheckWrapperUpdate error: " + updErr);
                    done({ status: "uptodate" });
                }
            });

            // System Tray & OpenPublisher-Branded Toast Notifications via crash-proof out-of-process helper (op_tray.exe)
            // with zero-callback Shell_NotifyIconW fallback if helper executable is absent.
            let _trayTip = "OpenPublisher";
            let _trayMenuItems = [];
            let _trayRemoving = false;
            let _trayQuitObserverAdded = false;
            let _trayServerSocket = null;
            let _trayTransport = null;
            let _trayOutStream = null;
            let _trayInStream = null;
            let _trayHelperStarted = false;
            let _trayPendingCmds = [];
            let _trayFallbackAdded = false;
            let _trayFallbackHwnd = null;

            function writeFixedWideStr(arr, maxLen, text) {
                let s = String(text || "");
                let limit = Math.min(s.length, maxLen - 1);
                for (let i = 0; i < maxLen; i++) {
                    arr[i] = (i < limit) ? s.charCodeAt(i) : 0;
                }
            }

            function resolveBrandingIcons() {
                if (!user32_LoadImageW || !appRootDir) return;
                try {
                    if (!cachedSmallIcon || cachedSmallIcon.isNull() || !cachedBigIcon || cachedBigIcon.isNull()) {
                        let icoFile = appRootDir.clone();
                        icoFile.append("assets");
                        icoFile.append("branding");
                        icoFile.append("OpenPublisherV5.ico");
                        if (icoFile.exists()) {
                            if (!cachedSmallIcon || cachedSmallIcon.isNull()) {
                                cachedSmallIcon = user32_LoadImageW(null, icoFile.path, 1, 16, 16, 0x0010);
                            }
                            if (!cachedBigIcon || cachedBigIcon.isNull()) {
                                cachedBigIcon = user32_LoadImageW(null, icoFile.path, 1, 48, 48, 0x0010);
                            }
                        }
                    }
                } catch(icoErr) {
                    logDebug("resolveBrandingIcons error: " + icoErr);
                }
            }

            function sendTrayHelperLine(obj) {
                if (_trayRemoving) return false;
                let line = JSON.stringify(obj) + "\n";
                if (_trayOutStream) {
                    try {
                        let bytes = new TextEncoder("utf-8").encode(line);
                        let bos = Cc["@mozilla.org/binaryoutputstream;1"].createInstance(Ci.nsIBinaryOutputStream);
                        bos.setOutputStream(_trayOutStream);
                        bos.writeByteArray(Array.from(bytes), bytes.length);
                        _trayOutStream.flush();
                        return true;
                    } catch(wErr) {
                        logDebug("sendTrayHelperLine write error: " + wErr);
                        try { _trayOutStream.close(); } catch(e) {}
                        _trayOutStream = null;
                    }
                }
                if (_trayPendingCmds.length < 32) {
                    _trayPendingCmds.push(obj);
                }
                return false;
            }

            function ensureTrayFallbackIconActive(tipTitle) {
                if (!ctypes || !NOTIFYICONDATAW_TYPE || !shell32_Shell_NotifyIconW) return false;
                try {
                    let hwnd = mainOPWindow ? getWindowHWND(mainOPWindow) : null;
                    if (!hwnd || hwnd.isNull()) return false;
                    resolveBrandingIcons();
                    _trayFallbackHwnd = hwnd;
                    let nid = new NOTIFYICONDATAW_TYPE();
                    nid.cbSize = NOTIFYICONDATAW_TYPE.size;
                    nid.hWnd = hwnd;
                    nid.uID = 1001;
                    nid.uFlags = 0x02 | 0x04; // NIF_ICON | NIF_TIP
                    nid.hIcon = cachedSmallIcon || null;
                    writeFixedWideStr(nid.szTip, 128, tipTitle || _trayTip || "OpenPublisher");
                    let ok = shell32_Shell_NotifyIconW(_trayFallbackAdded ? 1 : 0, nid.address());
                    if (ok) _trayFallbackAdded = true;
                    return Boolean(ok || _trayFallbackAdded);
                } catch(e) {
                    return false;
                }
            }

            function ensureTrayHelperRunning(tipTitle) {
                if (_trayRemoving) return false;
                if (tipTitle) _trayTip = String(tipTitle).slice(0, 63);
                if (!_trayQuitObserverAdded) {
                    _trayQuitObserverAdded = true;
                    try {
                        Services.obs.addObserver({
                            observe: function() { removeTrayIconNow(); }
                        }, "quit-application", false);
                    } catch(obsErr) {}
                }
                if (_trayHelperStarted) return true;
                if (!appRootDir) return ensureTrayFallbackIconActive(_trayTip);

                let helperFile = appRootDir.clone();
                helperFile.append("op_tray.exe");
                if (!helperFile.exists() || !helperFile.isFile()) {
                    return ensureTrayFallbackIconActive(_trayTip);
                }

                try {
                    let srv = Cc["@mozilla.org/network/server-socket;1"].createInstance(Ci.nsIServerSocket);
                    srv.init(-1, true, 4); // ephemeral port, loopback-only
                    _trayServerSocket = srv;
                    let srvPort = srv.port;
                    let recvBuf = "";

                    srv.asyncListen({
                        onSocketAccepted: function(serv, transport) {
                            try {
                                _trayTransport = transport;
                                _trayOutStream = transport.openOutputStream(0, 0, 0);
                                let rawIn = transport.openInputStream(0, 0, 0);
                                _trayInStream = rawIn.QueryInterface(Ci.nsIAsyncInputStream);

                                let reader = {
                                    onInputStreamReady: function(stream) {
                                        try {
                                            let avail = 0;
                                            try { avail = stream.available(); } catch(ae) { return; }
                                            if (avail > 0) {
                                                let sis = Cc["@mozilla.org/scriptableinputstream;1"].createInstance(Ci.nsIScriptableInputStream);
                                                sis.init(stream);
                                                let chunk = sis.read(avail);
                                                recvBuf += chunk;
                                                let nl;
                                                while ((nl = recvBuf.indexOf("\n")) !== -1) {
                                                    let rawLine = recvBuf.substring(0, nl).trim();
                                                    recvBuf = recvBuf.substring(nl + 1);
                                                    if (!rawLine) continue;
                                                    try {
                                                        let evt = JSON.parse(rawLine);
                                                        if (evt.type === "click") {
                                                            globalMM.broadcastAsyncMessage("Gecko:ToWrapper", { type: "tray_click" });
                                                        } else if (evt.type === "menu_click" && evt.id) {
                                                            globalMM.broadcastAsyncMessage("Gecko:ToWrapper", { type: "tray_menu_click", itemId: Number(evt.id) });
                                                        }
                                                    } catch(je) {}
                                                }
                                            }
                                            if (!_trayRemoving && _trayInStream) {
                                                _trayInStream.asyncWait(reader, 0, 0, Services.tm.mainThread);
                                            }
                                        } catch(re) {}
                                    }
                                };
                                _trayInStream.asyncWait(reader, 0, 0, Services.tm.mainThread);

                                // Flush buffered commands cleanly on connection
                                let queued = _trayPendingCmds.splice(0, _trayPendingCmds.length);
                                for (let i = 0; i < queued.length; i++) {
                                    sendTrayHelperLine(queued[i]);
                                }
                            } catch(accErr) {
                                logDebug("Tray socket accept error: " + accErr);
                            }
                        },
                        onStopListening: function() {}
                    });

                    let icoFile = appRootDir.clone();
                    icoFile.append("assets");
                    icoFile.append("branding");
                    icoFile.append("OpenPublisherV5.ico");

                    let proc = Cc["@mozilla.org/process/util;1"].createInstance(Ci.nsIProcess);
                    proc.init(helperFile);
                    let pid = (Services.appinfo && Services.appinfo.processID) ? Services.appinfo.processID : 0;
                    let args = ["--port=" + srvPort, "--pid=" + pid];
                    if (icoFile.exists()) {
                        args.push("--icon=" + icoFile.path);
                    }
                    proc.runwAsync(args, args.length);
                    _trayHelperStarted = true;
                    sendTrayHelperLine({ cmd: "init", title: _trayTip });
                    return true;
                } catch(trayStartErr) {
                    logDebug("ensureTrayHelperRunning error: " + trayStartErr);
                    return ensureTrayFallbackIconActive(_trayTip);
                }
            }

            function removeTrayIconNow() {
                _trayRemoving = true;
                try {
                    if (_trayOutStream) {
                        let bye = new TextEncoder("utf-8").encode('{"cmd":"remove"}\n');
                        let bos = Cc["@mozilla.org/binaryoutputstream;1"].createInstance(Ci.nsIBinaryOutputStream);
                        bos.setOutputStream(_trayOutStream);
                        bos.writeByteArray(Array.from(bye), bye.length);
                        _trayOutStream.flush();
                        _trayOutStream.close();
                    }
                } catch(e) {}
                _trayOutStream = null;
                try { if (_trayInStream) _trayInStream.close(); } catch(e) {}
                _trayInStream = null;
                try { if (_trayTransport) _trayTransport.close(0); } catch(e) {}
                _trayTransport = null;
                try { if (_trayServerSocket) _trayServerSocket.close(); } catch(e) {}
                _trayServerSocket = null;
                try {
                    if (_trayFallbackAdded && _trayFallbackHwnd && !_trayFallbackHwnd.isNull() && shell32_Shell_NotifyIconW && NOTIFYICONDATAW_TYPE) {
                        let nid = new NOTIFYICONDATAW_TYPE();
                        nid.cbSize = NOTIFYICONDATAW_TYPE.size;
                        nid.hWnd = _trayFallbackHwnd;
                        nid.uID = 1001;
                        shell32_Shell_NotifyIconW(2 /* NIM_DELETE */, nid.address());
                    }
                } catch(e2) {}
                _trayFallbackAdded = false;
            }

            globalMM.addMessageListener("Gecko:Tray", function(msg) {
                try {
                    let data = msg.data || {};
                    let action = String(data.action || "");
                    if (action === "init") {
                        ensureTrayHelperRunning(data.title || "OpenPublisher");
                    } else if (action === "updateMenu") {
                        try {
                            _trayMenuItems = data.itemsJson ? JSON.parse(String(data.itemsJson)) : [];
                        } catch(pe) {
                            _trayMenuItems = [];
                        }
                        if (!_trayHelperStarted) {
                            ensureTrayHelperRunning(_trayTip);
                        }
                        if (_trayHelperStarted) {
                            sendTrayHelperLine({ cmd: "menu", items: _trayMenuItems });
                        }
                    } else if (action === "remove") {
                        removeTrayIconNow();
                    }
                } catch(trayErr) {
                    logDebug("Gecko:Tray error: " + trayErr);
                }
            });

            globalMM.addMessageListener("Gecko:ShowNotification", function(msg) {
                let data = msg.data || {};
                let title = String(data.title || "OpenPublisher");
                let message = String(data.message || "");
                let sent = false;
                try {
                    ensureTrayHelperRunning(_trayTip || "OpenPublisher");
                    if (_trayHelperStarted) {
                        sendTrayHelperLine({ cmd: "notify", title: title, message: message });
                        sent = true;
                    } else if (ensureTrayFallbackIconActive(_trayTip || "OpenPublisher") && NOTIFYICONDATAW_TYPE && shell32_Shell_NotifyIconW && _trayFallbackHwnd && !_trayFallbackHwnd.isNull()) {
                        resolveBrandingIcons();
                        let nid = new NOTIFYICONDATAW_TYPE();
                        nid.cbSize = NOTIFYICONDATAW_TYPE.size;
                        nid.hWnd = _trayFallbackHwnd;
                        nid.uID = 1001;
                        nid.uFlags = 0x10;
                        writeFixedWideStr(nid.szInfoTitle, 64, title);
                        writeFixedWideStr(nid.szInfo, 256, message);
                        nid.dwInfoFlags = (cachedBigIcon && !cachedBigIcon.isNull()) ? (0x04 | 0x20) : 0x01;
                        nid.hBalloonIcon = (cachedBigIcon && !cachedBigIcon.isNull()) ? cachedBigIcon : (cachedSmallIcon || null);
                        sent = Boolean(shell32_Shell_NotifyIconW(1, nid.address()));
                    }
                } catch(notiErr) {
                    logDebug("Gecko:ShowNotification error: " + notiErr);
                }
                if (!sent) {
                    try {
                        globalMM.broadcastAsyncMessage("Gecko:ToWrapper", {
                            type: "op_fallback_toast",
                            title: title,
                            message: message
                        });
                    } catch(fbErr) {}
                }
            });

            globalMM.addMessageListener("Gecko:GetClipboardImage", function(msg) {
                try {
                    let wantJpeg = (msg.data && msg.data.type && String(msg.data.type).includes("jpeg"));
                    let encodeTarget = wantJpeg ? "image/jpeg" : "image/png";

                    // 1. Direct Win32 Clipboard read (eliminates Windows GDI CF_DIBV5 12-byte bitmask shift / 1px top black line)
                    if (ctypes && user32_OpenClipboard && user32_CloseClipboard && user32_GetClipboardData && kernel32_GlobalLock && kernel32_GlobalUnlock && kernel32_GlobalSize) {
                        let opened = false;
                        try {
                            opened = user32_OpenClipboard(null);
                            if (opened) {
                                // 1a. Check native PNG format first (lossless, exact bytes)
                                if (!wantJpeg && user32_RegisterClipboardFormatW && user32_IsClipboardFormatAvailable) {
                                    let pngFmt = user32_RegisterClipboardFormatW("PNG");
                                    if (pngFmt && user32_IsClipboardFormatAvailable(pngFmt)) {
                                        let hMem = user32_GetClipboardData(pngFmt);
                                        if (hMem && !hMem.isNull()) {
                                            let sz = Number(kernel32_GlobalSize(hMem));
                                            let ptr = kernel32_GlobalLock(hMem);
                                            if (ptr && !ptr.isNull() && sz > 8) {
                                                try {
                                                    let byteArr = ctypes.cast(ptr, ctypes.uint8_t.array(sz).ptr).contents;
                                                    let chunks = [];
                                                    for (let i = 0; i < sz; i += 8192) {
                                                        let end = Math.min(sz, i + 8192);
                                                        let sub = [];
                                                        for (let j = i; j < end; j++) sub.push(byteArr[j]);
                                                        chunks.push(String.fromCharCode.apply(null, sub));
                                                    }
                                                    let b64 = encodeB64Bytes(chunks.join(""));
                                                    if (b64) {
                                                        return "data:image/png;base64," + b64;
                                                    }
                                                } finally {
                                                    kernel32_GlobalUnlock(hMem);
                                                }
                                            }
                                        }
                                    }
                                }

                                // 1b. Read CF_DIB (8) and construct a clean 54-byte BI_RGB BMP header with exact pixel offset
                                if (user32_IsClipboardFormatAvailable && user32_IsClipboardFormatAvailable(8)) {
                                    let hDib = user32_GetClipboardData(8);
                                    if (hDib && !hDib.isNull()) {
                                        let sz = Number(kernel32_GlobalSize(hDib));
                                        let ptr = kernel32_GlobalLock(hDib);
                                        if (ptr && !ptr.isNull() && sz > 40) {
