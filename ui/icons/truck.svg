<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <!-- 1. Solid White Outer Halo & Interior Fill (100% visible on dark backgrounds) -->
  <path d="M1 1 h18 v5 h5 v2 h1 v2 h1 v2 h1 v9 h-2 v3 h-6 v-2 h-8 v2 h-6 v-3 h-4 v-19 h1 z" fill="#FFFFFF" />

  <!-- 2. Crisp 1px Black Pixel Art -->
  <g fill="#000000">
    <!-- Cargo Box (1px border, 17x15 interior) -->
    <rect x="2" y="2" width="17" height="1" />
    <rect x="1" y="3" width="1" height="15" />
    <rect x="19" y="3" width="1" height="15" />
    <rect x="1" y="18" width="19" height="1" />

    <!-- Cab Outline (1px border) -->
    <rect x="20" y="7" width="4" height="1" />
    <rect x="24" y="8" width="1" height="2" />
    <rect x="25" y="10" width="1" height="2" />
    <rect x="26" y="12" width="1" height="7" />
    <rect x="20" y="18" width="7" height="1" />

    <!-- Cab Window (1px frame) -->
    <rect x="21" y="9" width="2" height="1" />
    <rect x="21" y="10" width="1" height="4" />
    <rect x="21" y="13" width="4" height="1" />
    <rect x="23" y="10" width="1" height="2" />
    <rect x="24" y="12" width="1" height="1" />

    <!-- Door Handle -->
    <rect x="21" y="15" width="2" height="1" />

    <!-- Bumpers & Undercarriage -->
    <rect x="1" y="19" width="3" height="1" />
    <rect x="11" y="19" width="7" height="1" />
    <rect x="25" y="19" width="2" height="1" />

    <!-- Left Wheel (1px tire ring + 1px hub dot) -->
    <rect x="5" y="18" width="5" height="1" />
    <rect x="4" y="19" width="1" height="4" />
    <rect x="10" y="19" width="1" height="4" />
    <rect x="5" y="23" width="5" height="1" />
    <rect x="7" y="20" width="1" height="2" />

    <!-- Right Wheel (1px tire ring + 1px hub dot) -->
    <rect x="19" y="18" width="5" height="1" />
    <rect x="18" y="19" width="1" height="4" />
    <rect x="24" y="19" width="1" height="4" />
    <rect x="19" y="23" width="5" height="1" />
    <rect x="21" y="20" width="1" height="2" />

    <!-- 4-Way Cross (1px shafts, centered at X:10, Y:10) -->
    <rect x="10" y="4" width="1" height="13" />
    <rect x="4" y="10" width="13" height="1" />
    <!-- Top Arrowhead -->
    <rect x="9" y="5" width="3" height="1" />
    <rect x="8" y="6" width="5" height="1" />
    <!-- Bottom Arrowhead -->
    <rect x="9" y="15" width="3" height="1" />
    <rect x="8" y="14" width="5" height="1" />
    <!-- Left Arrowhead -->
    <rect x="5" y="9" width="1" height="3" />
    <rect x="6" y="8" width="1" height="5" />
    <!-- Right Arrowhead -->
    <rect x="15" y="9" width="1" height="3" />
    <rect x="14" y="8" width="1" height="5" />
  </g>
</svg>