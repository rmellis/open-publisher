                                }

                                win.addEventListener("keydown", function(e) {
                                    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === "p" || e.key === "P" || e.code === "KeyP")) {
                                        if (e.repeat) {
                                            e.preventDefault();
                                            e.stopPropagation();
                                            return;
                                        }
                                        if (dispatchWrapperPrint()) {
                                            e.preventDefault();
                                            e.stopPropagation();
                                        }
                                    }
                                }, true);
                            } catch(e) {}

                            try {
                                win.resizeTo(1320, 760);
                                if (win.screen) {
                                    let x = Math.max(0, Math.round((win.screen.availWidth - 1320) / 2));
                                    let y = Math.max(0, Math.round((win.screen.availHeight - 760) / 2));
                                    win.moveTo(x, y);
                                }
                            } catch(e) {
                                logDebug("resizeTo/moveTo error: " + e);
                            }

                            let wrapperLoadTriggered = false;
                            function checkAndEnsureWrapper() {
                                try {
                                    if (win.closed || !win.gBrowser) return;
                                    let tabs = win.gBrowser.tabs;
                                    let wrapperTab = null;
                                    let blankTabs = [];
                                    for (let i = 0; i < tabs.length; i++) {
                                        let t = tabs[i];
                                        let tb = t.linkedBrowser;
                                        let u = (tb && tb.currentURI) ? tb.currentURI.spec : "";
                                        let isLoading = (tb && tb.webProgress && tb.webProgress.isLoadingDocument);
                                        if (u && u.includes("wrapper.html")) {
                                            wrapperTab = t;
                                        } else if (!u || u === "about:blank") {
                                            if (!isLoading) blankTabs.push(t);
                                        }
                                    }

                                    if (wrapperTab) {
                                        if (win.gBrowser.selectedTab !== wrapperTab) {
                                            win.gBrowser.selectedTab = wrapperTab;
                                        }
                                        for (let bt of blankTabs) {
                                            try {
                                                if (tabs.length > 1 && bt !== wrapperTab) {
                                                    win.gBrowser.removeTab(bt);
                                                }
                                            } catch(e) {}
                                        }
                                        wrapperLoadTriggered = true;
                                        return;
                                    }

                                    let b = win.gBrowser.selectedBrowser;
                                    let isLoading = (b && b.webProgress && b.webProgress.isLoadingDocument);
                                    if (isLoading) return;

                                    let cur = (b && b.currentURI) ? b.currentURI.spec : "";
                                    if (!wrapperLoadTriggered && (!cur || cur === "about:blank") && wrapperUrl !== "about:blank") {
                                        wrapperLoadTriggered = true;
                                        logDebug("Navigating mainOPWindow selectedBrowser to wrapperUrl: " + wrapperUrl);
                                        let targetURI = Services.io.newURI(wrapperUrl);
                                        if (typeof win.openUILinkIn === "function") {
                                            win.openUILinkIn(wrapperUrl, "current", {
                                                triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal()
                                            });
                                        } else if (b && typeof b.loadURI === "function") {
                                            b.loadURI(targetURI, {
                                                triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal()
                                            });
                                        }
                                    }
                                } catch(e) {
                                    logDebug("checkAndEnsureWrapper error: " + e);
                                }
                            }

                            win.setTimeout(checkAndEnsureWrapper, 1500);
                            win.setTimeout(checkAndEnsureWrapper, 3500);
                        } else {
                            let now = Date.now();
                            pendingChildSpecs = pendingChildSpecs.filter(function(s) { return (now - s.ts) < 10000; });
                            let spec = pendingChildSpecs.length > 0 ? pendingChildSpecs.shift() : null;
                            logDebug("Initialized child tear-away window (popup=" + isPopupChrome + ", arg0=" + argStr + ", queuedUrl=" + (spec ? spec.url : "none") + ").");

                            // Safety net: if an unqueued child browser window opens for an external http(s) URL, redirect to OS default browser and close it
                            if (!spec) {
                                if (argStr.startsWith("http://") || argStr.startsWith("https://") || argStr.startsWith("mailto:")) {
                                    openExternalUrl(argStr);
                                    try { win.close(); } catch(e) {}
                                    return;
                                }
                                win.setTimeout(function() {
                                    try {
                                        if (win.closed || !win.gBrowser) return;
                                        let b = win.gBrowser.selectedBrowser;
                                        let cur = (b && b.currentURI) ? b.currentURI.spec : "";
                                        if (cur && (cur.startsWith("http://") || cur.startsWith("https://") || cur.startsWith("mailto:"))) {
                                            openExternalUrl(cur);
                                            win.close();
                                        }
                                    } catch(e) {}
                                }, 150);
                            }

                            function applyChildSpec() {
                                enforceChromelessWindow(win, doc);
                                if (!spec || win.closed) return;
                                try {
                                    win.resizeTo(Math.round(spec.w), Math.round(spec.h));
                                    win.moveTo(Math.round(spec.left), Math.round(spec.top));
                                    if (spec.alwaysOnTop) {
                                        let hwnd = getWindowHWND(win);
                                        if (hwnd && user32_SetWindowPos && ctypes) {
                                            user32_SetWindowPos(hwnd, ctypes.voidptr_t(ctypes.Int64(-1)), 0, 0, 0, 0, 0x0013);
                                        }
                                    }
                                } catch(specErr) {}
                            }

                            applyChildSpec();
                            win.addEventListener("load", applyChildSpec, { once: true });
                            win.setTimeout(applyChildSpec, 150);

                            if (spec && spec.url) {
                                function ensureChildUrlLoaded() {
                                    try {
                                        if (win.closed || !win.gBrowser) return;
                                        let b = win.gBrowser.selectedBrowser;
                                        if (!b) return;
                                        let cur = b.currentURI ? b.currentURI.spec : "";
                                        if (cur && cur !== "about:blank") {
                                            return;
                                        }
                                        logDebug("Navigating child tear-away browser directly to: " + spec.url);
                                        let sysPrin = Services.scriptSecurityManager.getSystemPrincipal();
                                        if (typeof b.fixupAndLoadURIString === "function") {
                                            b.fixupAndLoadURIString(spec.url, { triggeringPrincipal: sysPrin });
                                        } else {
                                            b.loadURI(Services.io.newURI(spec.url), { triggeringPrincipal: sysPrin });
                                        }
                                    } catch(navErr) {
                                        logDebug("Child nav error: " + navErr);
                                    }
                                }
                                win.setTimeout(ensureChildUrlLoaded, 120);
                                win.setTimeout(ensureChildUrlLoaded, 350);
                                win.setTimeout(ensureChildUrlLoaded, 800);
                            }
                        }
                    }

                    if (doc.readyState === "complete" || doc.readyState === "interactive") {
                        initOPWindow();
                    } else {
                        win.addEventListener("DOMContentLoaded", initOPWindow, { once: true });
                        win.setTimeout(initOPWindow, 100);
                    }
                } catch(e) {
                    logDebug("Observer callback error: " + e);
                }
            }
        }, "document-element-inserted", false);

    } catch(globalErr) {
        logDebug("AutoConfig global error: " + globalErr);
    }
})();
