<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="../gecko_nw_shim.js"></script>
    <title>Presentation Preview - OpenPublisher</title>
    <!-- OpenPublisher Fonts & Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Acme&family=Anton&family=Architects+Daughter&family=Archivo+Black&family=Arvo:wght@400;700&family=Bangers&family=Barlow:wght@400;700&family=Bebas+Neue&family=Bitter:wght@400;700&family=Bree+Serif&family=Cabin:wght@400;700&family=Cairo:wght@400;700&family=Caveat:wght@400;700&family=Cinzel:wght@400;700&family=Comfortaa:wght@400;700&family=Comic+Neue:wght@400;700&family=Concert+One&family=Cookie&family=Courgette&family=Creepster&family=Crimson+Text:wght@400;700&family=Dancing+Script:wght@400;700&family=DM+Sans:wght@400;700&family=Dosis:wght@400;700&family=EB+Garamond:wght@400;700&family=Exo+2:wght@400;700&family=Fira+Sans:wght@400;700&family=Fjalla+One&family=Fredoka+One&family=Gloria+Hallelujah&family=Great+Vibes&family=Heebo:wght@400;700&family=Hind:wght@400;700&family=IBM+Plex+Sans:wght@400;700&family=Inconsolata:wght@400;700&family=Indie+Flower&family=Josefin+Sans:wght@400;700&family=Kanit:wght@400;700&family=Karla:wght@400;700&family=Lato:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Lobster&family=Lora:wght@400;700&family=Manrope:wght@400;700&family=Maven+Pro:wght@400;700&family=Merriweather:wght@400;700&family=Monoton&family=Montserrat:wght@400;700&family=Mukta:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Noto+Sans:wght@400;700&family=Nunito:wght@400;700&family=Old+Standard+TT:wght@400;700&family=Open+Sans:wght@400;700&family=Orbitron:wght@400;700&family=Oswald:wght@400;700&family=Oxygen:wght@400;700&family=Pacifico&family=Passion+One:wght@400;700&family=Patrick+Hand&family=Permanent+Marker&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;700&family=Press+Start+2P&family=Prompt:wght@400;700&family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&family=Quicksand:wght@400;700&family=Rajdhani:wght@400;700&family=Raleway:wght@400;700&family=Righteous&family=Roboto:wght@400;700&family=Roboto+Condensed:wght@400;700&family=Roboto+Mono:wght@400;700&family=Roboto+Slab:wght@400;700&family=Rubik:wght@400;700&family=Sacramento&family=Satisfy&family=Shadows+Into+Light&family=Signika:wght@400;700&family=Slabo+27px&family=Source+Code+Pro:wght@400;700&family=Source+Sans+Pro:wght@400;700&family=Space+Mono:wght@400;700&family=Teko:wght@400;700&family=Titillium+Web:wght@400;700&family=Ubuntu:wght@400;700&family=Varela+Round&family=Vollkorn:wght@400;700&family=Work+Sans:wght@400;700&family=Yanone+Kaffeesatz:wght@400;700&family=Zilla+Slab:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://openpublisher.app/style.css?v=4.20.5">
    <link rel="stylesheet" href="wa_rules.css">
    <style>
        :root {
            --bg-color: #007670;
            --accent-color: #ffffff;
            --scroll-track: #0b1120 !important;
            --scroll-border: #0b1120 !important;
            --main-scrollbar-thumb: #007670 !important;
            --main-scrollbar-thumb-hover: #009e94 !important;
        }
        /* Custom Teal Green on Dark Scrollbars (Scoped to this window) */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
            scrollbar-color: var(--bg-color, #007670) #0b1120 !important;
        }
        ::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
        }
        ::-webkit-scrollbar-track {
            background: #0b1120 !important;
            border-radius: 5px !important;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-color, #007670) !important;
            border-radius: 5px !important;
            border: 2px solid #0b1120 !important;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #009e94 !important;
        }
        ::-webkit-scrollbar-corner {
            background: #0b1120 !important;
        }
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            background: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 12px;
            color: #e2e8f0;
        }
        #preview-window {
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(14px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-radius 0.2s ease;
        }
        body.fullscreen-mode #preview-window {
            border-radius: 0;
            border: none;
        }

        /* HEADER */
        #preview-header {
            background: var(--bg-color, #007670);
            color: white;
            padding: 7px 8px 7px 14px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            -webkit-app-region: drag !important;
            cursor: default !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            border-top-left-radius: 11px;
            border-top-right-radius: 11px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.25);
        }
        body.fullscreen-mode #preview-header {
            border-radius: 0;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-app-region: drag !important;
            pointer-events: none !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            cursor: default !important;
        }
        .header-left * {
            -webkit-app-region: drag !important;
            pointer-events: none !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            cursor: default !important;
        }
        .header-icon {
            display: flex;
            align-items: center;
            color: #a7f3d0;
        }
        .header-badge {
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
            display: inline-block;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            -webkit-app-region: no-drag !important;
        }
        .header-btn {
            cursor: pointer !important;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.25);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background 0.2s, transform 0.1s;
            -webkit-app-region: no-drag !important;
            pointer-events: auto !important;
        }
        .header-btn * {
            pointer-events: none !important;
            -webkit-app-region: no-drag !important;
        }
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .header-btn.close-btn:hover {
            background: #d35450 !important;
        }

        /* TOOLBAR */
        #preview-toolbar {
            background: #090e17;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid #1e293b;
            flex-wrap: wrap;
            -webkit-app-region: no-drag;
        }
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #preview-toolbar .tool-btn {
            height: 32px !important;
            min-height: 32px !important;
            max-height: 32px !important;
            flex-direction: row !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 0 12px !important;
            gap: 7px !important;
            background: #1e293b !important;
            border: 1px solid #334155 !important;
            color: #cbd5e1 !important;
            border-radius: 6px !important;
            font-size: 11px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            transition: all 0.15s ease !important;
            line-height: 1 !important;
            box-sizing: border-box !important;
            white-space: nowrap !important;
            margin: 0 !important;
        }
        #preview-toolbar .tool-btn.icon-btn {
            width: 32px !important;
            min-width: 32px !important;
            padding: 0 !important;
        }
        #preview-toolbar .tool-btn:hover:not(:disabled) {
            background: #334155 !important;
            color: #ffffff !important;
            border-color: #475569 !important;
        }
        #preview-toolbar .tool-btn:disabled {
            opacity: 0.35 !important;
            cursor: not-allowed !important;
        }
        #preview-toolbar .tool-btn.active {
            background: var(--bg-color, #007670) !important;
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 0 10px rgba(0, 118, 112, 0.4) !important;
        }
        #page-display {
            height: 32px !important;
            line-height: 30px !important;
            padding: 0 12px !important;
            border-radius: 6px !important;
            background: #1e293b !important;
            border: 1px solid #334155 !important;
            font-size: 11px !important;
            font-weight: 600 !important;
            color: #38bdf8 !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            min-width: 90px !important;
        }
        .zoom-label {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            min-width: 44px;
            text-align: center;
            font-family: monospace;
        }
        .backdrop-selector {
            display: flex;
            align-items: center;
            background: #1e293b;
            border-radius: 6px;
            padding: 3px;
            border: 1px solid #334155;
            height: 32px;
            box-sizing: border-box;
        }
        .backdrop-option {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin: 0 2px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s;
        }
        .backdrop-option:hover {
            transform: scale(1.1);
        }
        .backdrop-option.selected {
            border-color: #38bdf8;
            box-shadow: 0 0 4px #38bdf8;
        }

        /* VIEWPORT */
        #preview-viewport {
            flex: 1;
            overflow: auto;
            display: flex;
            padding: 24px;
            position: relative;
            background: #0b1120;
            transition: background 0.2s ease;
        }
        #preview-viewport.bg-dark {
            background: #090e17;
        }
        #preview-viewport.bg-black {
            background: #000000;
        }
        #preview-viewport.bg-light {
            background: #cbd5e1;
        }
        #preview-viewport.bg-grid {
            background-color: #0f172a;
            background-image: 
                linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        /* STAGE WRAPPER FOR FLAWLESS CENTERING & SCROLLING */
        #stage-wrapper {
            margin: auto;
            position: relative;
            flex-shrink: 0;
            display: block;
        }

        /* PAGE CANVAS STAGE */
        #page-stage {
            position: absolute;
            top: 0;
            left: 0;
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
            transform-origin: top left;
            transition: transform 0.1s ease-out;
            overflow: hidden;
            pointer-events: none; /* read-only presentation */
        }

        /* OPENPUBLISHER CANVAS ELEMENT SYSTEM */
        .pub-element {
            position: absolute !important;
            box-sizing: border-box !important;
            cursor: default !important;
            user-select: none !important;
            z-index: 10;
            outline: none !important;
        }
        .pub-element.selected {
            outline: none !important;
        }
        .element-content {
            width: 100% !important;
            height: 100% !important;
            overflow: visible !important;
            position: relative !important;
            user-select: none !important;
            outline: none !important;
            box-sizing: border-box !important;
        }
        .element-content img, .element-content svg {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important;
            pointer-events: none !important;
            display: block !important;
            position: absolute !important;
            top: 0px !important;
            left: 0px !important;
        }
        .element-content h1, .element-content h2, .element-content h3, 
        .element-content h4, .element-content h5, .element-content h6, 
        .element-content p {
            margin-top: 0px !important;
            margin-bottom: 0px !important;
        }
        .wa-wrapper {
            width: 100% !important;
            height: 100% !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            overflow: visible !important;
        }
        .wa-text {
            font-family: Impact, "Segoe UI", sans-serif;
            font-size: 40px;
            text-align: center;
            line-height: 1;
            white-space: nowrap;
            outline: none;
            pointer-events: none;
            display: inline-block;
        }
        .op-theme-container {
            position: absolute !important;
            top: 0px !important;
            left: 0px !important;
            bottom: 0px !important;
            right: 0px !important;
            width: 100% !important;
            height: 100% !important;
            pointer-events: none !important;
            z-index: -10 !important;
        }
        .op-theme-bg, .op-theme-tex {
            position: absolute !important;
            top: 0px !important;
            left: 0px !important;
            bottom: 0px !important;
            right: 0px !important;
            width: 100% !important;
            height: 100% !important;
        }
        .page-border-container {
            position: absolute !important;
            inset: 0px !important;
            pointer-events: none !important;
            z-index: 2500 !important;
            border: 0px solid black !important;
            box-sizing: border-box !important;
        }
        .page-header, .page-footer {
            display: none !important;
            position: absolute !important;
            left: 48px !important;
            right: 48px !important;
            height: 50px !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 12px !important;
            color: #64748b !important;
        }
        .page-header.visible, .page-footer.visible {
            display: flex !important;
        }
        .page-header { top: 10px !important; }
        .page-footer { bottom: 10px !important; }
        .margin-guides, .resize-handle, .rotate-handle, .rotate-stick, 
        .ui-resizable-handle, .selection-box, .guide-line, .canvas-cursor, 
        .crop-handle, .rotation-handle, .ui-draggable-handle {
            display: none !important;
        }

        /* SLIDE OVERLAY CONTROLS */
        #presentation-hud {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 6px 16px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        #presentation-hud.show {
            opacity: 1;
        }
        .pres-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .pres-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* FOOTER */
        #preview-footer {
            background: #090e17;
            border-top: 1px solid #1e293b;
            padding: 5px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #64748b;
        }
        .footer-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .footer-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: monospace;
            font-size: 10px;
        }

        /* Loading / Waiting state */
        .stage-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #64748b;
            gap: 10px;
            font-size: 13px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="preview-window">
        <!-- HEADER -->
        <div id="preview-header">
            <div class="header-left">
                <div class="header-icon">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </div>
                <span>Document Presentation Preview</span>
                <span class="live-dot" title="Live sync connected"></span>
                <span class="header-badge" id="preview-doc-title">Active Publication</span>
                <span class="header-badge" id="preview-page-badge" style="background: rgba(34,197,94,0.2); color: #4ade80;">Page 1/1</span>
            </div>
            <div class="header-actions">
                <div class="header-btn" id="btn-fullscreen-toggle" title="Toggle Slide / Fullscreen Mode (F11)">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.2" fill="none">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                </div>
                <div class="header-btn" id="btn-dock" title="Dock back into OpenPublisher (Esc)">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
                        <polyline points="4 14 10 14 10 20"></polyline>
                        <polyline points="20 10 14 10 14 4"></polyline>
                        <line x1="14" y1="10" x2="21" y2="3"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                </div>
                <div class="header-btn close-btn" id="btn-close" title="Close Preview">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </div>
            </div>
        </div>

        <!-- TOOLBAR -->
        <div id="preview-toolbar">
            <!-- Navigation / Page Indicator -->
            <div class="toolbar-group">
                <div class="page-indicator-pill" id="page-display">Page 1 of 1</div>
            </div>

            <!-- Zoom & Fit -->
            <div class="toolbar-group">
                <button class="tool-btn active" id="btn-fit-page" title="Fit Entire Page in Window">
                    <i class="fa-solid fa-expand"></i>
                    <span>Fit Page</span>
                </button>
                <button class="tool-btn" id="btn-fit-width" title="Fit Page Width">
                    <i class="fa-solid fa-arrows-left-right-to-line"></i>
                    <span>Fit Width</span>
                </button>
                <button class="tool-btn icon-btn" id="btn-zoom-out" title="Zoom Out (-)">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <span class="zoom-label" id="zoom-label">100%</span>
                <button class="tool-btn icon-btn" id="btn-zoom-in" title="Zoom In (+)">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <!-- Backdrop & Mode -->
            <div class="toolbar-group">
                <span style="font-size: 11px; color: #94a3b8; font-weight: 500;">Backdrop:</span>
                <div class="backdrop-selector">
                    <div class="backdrop-option selected" id="bg-opt-dark" style="background: #090e17;" title="Dark Slate Backdrop"></div>
                    <div class="backdrop-option" id="bg-opt-black" style="background: #000000;" title="Pitch Black (Presentation)"></div>
                    <div class="backdrop-option" id="bg-opt-light" style="background: #e2e8f0;" title="Light Paper Backdrop"></div>
                    <div class="backdrop-option" id="bg-opt-grid" style="background: #334155;" title="Transparency Checkerboard"></div>
                </div>
            </div>

            <!-- Auto-Sync Toggle -->
            <div class="toolbar-group">
                <button class="tool-btn active" id="btn-auto-sync" title="Automatically update preview when changes occur in editor">
                    <span class="live-dot" style="width: 6px; height: 6px;"></span>
                    <span>Live Sync</span>
                </button>
                <button class="tool-btn" id="btn-reload-preview" title="Manually request live canvas from OpenPublisher">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span>Refresh</span>
                </button>
            </div>
        </div>

        <!-- MAIN VIEWPORT -->
        <div id="preview-viewport" class="bg-dark">
            <div id="stage-wrapper">
                <div id="page-stage" style="width: 794px; height: 1123px;">
                    <div class="stage-loading">
                        <div class="spinner"></div>
                        <span>Connecting to OpenPublisher Live Canvas...</span>
                    </div>
                </div>
            </div>

            <!-- Slide HUD for Presentation Mode -->
            <div id="presentation-hud">
                <span id="pres-page-text" style="font-size: 13px; font-weight: 600; min-width: 90px; text-align: center;">Page 1 of 1</span>
                <div style="width: 1px; height: 16px; background: rgba(255,255,255,0.2);"></div>
                <button class="pres-btn" id="pres-exit" title="Exit Presentation Mode (Esc / F11)">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                </button>
            </div>
        </div>

        <!-- FOOTER -->
        <div id="preview-footer">
            <div class="footer-left">
                <span class="live-dot" style="width: 6px; height: 6px;"></span>
                <span id="footer-status-text">Connected to Live Document Canvas</span>
            </div>
            <div class="footer-right">
                <span id="footer-dimensions">794 x 1123 px</span>
                <span id="footer-scale">Scale: 100%</span>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentDocument = null;
        let currentPageIndex = 0;
        let totalPages = 1;
        let currentZoom = 1.0;
        let fitMode = 'page';
        let autoSyncActive = true;
        let isFullscreen = false;
        let hudFadeTimeout = null;
        let liveSyncInterval = null;

        function getMainWin() {
            if (window.mainWin && !window.mainWin.closed && (window.mainWin.isMainWindow || typeof window.mainWin.requestLiveDocumentData === 'function' || typeof window.mainWin.switchEditorPage === 'function' || (window.mainWin.document && window.mainWin.document.getElementById('app-view')))) {
                return window.mainWin;
            }
            if (window.opener && !window.opener.closed && (window.opener.isMainWindow || typeof window.opener.requestLiveDocumentData === 'function' || typeof window.opener.switchEditorPage === 'function' || (window.opener.document && window.opener.document.getElementById('app-view')))) {
                return window.opener;
            }
            try {
                if (typeof nw !== 'undefined' && nw.Window && nw.Window.getAll) {
                    const wins = nw.Window.getAll();
                    for (let i = 0; i < wins.length; i++) {
                        const w = wins[i] && wins[i].window;
                        if (w && !w.closed && (w.isMainWindow || typeof w.requestLiveDocumentData === 'function' || (w.document && w.document.getElementById('app-view')))) {
                            window.mainWin = w;
                            return w;
                        }
                    }
                }
            } catch(e) {}
            return null;
        }

        // Auto-close if the main OpenPublisher application window is closed or terminates
        let hasSeenMainWindow = false;
        setInterval(function() {
            const mw = getMainWin();
            if (mw && !mw.closed) {
                hasSeenMainWindow = true;
            } else if (hasSeenMainWindow) {
                try {
                    if (typeof nw !== 'undefined' && nw.Window && typeof nw.Window.get === 'function') {
                        nw.Window.get().close(true);
                    } else {
                        window.close();
                    }
                } catch(e) {}
            }
        }, 350);

        function syncTheme() {
            try {
                const mw = getMainWin();
                if (mw && mw.document && mw.document.documentElement) {
                    const bgColor = mw.document.documentElement.style.getPropertyValue('--bg-color');
                    const accentColor = mw.document.documentElement.style.getPropertyValue('--accent-color');
                    if (bgColor) document.documentElement.style.setProperty('--bg-color', bgColor);
                    if (accentColor) document.documentElement.style.setProperty('--accent-color', accentColor);
                }
            } catch(e) {}
        }

        // External API called from wrapper.html when live data arrives
        window.receiveDocumentData = function(docData) {
            if (!autoSyncActive && currentDocument) return;
            if (typeof docData === 'string') {
                try { currentDocument = JSON.parse(docData); } catch(e) { return; }
            } else {
                currentDocument = docData;
            }

            if (!currentDocument) return;

            const docTitle = currentDocument.title || currentDocument.name || 'Untitled Publication';
            const titleEl = document.getElementById('preview-doc-title');
            if (titleEl) titleEl.textContent = docTitle;

            // Normalize live canvas format if passed as direct fields
            if (!currentDocument.liveCanvas && (currentDocument.rawCanvasHtml || currentDocument.html)) {
                currentDocument.liveCanvas = {
                    html: currentDocument.rawCanvasHtml || currentDocument.html,
                    width: currentDocument.canvasWidth || currentDocument.width || 794,
                    height: currentDocument.canvasHeight || currentDocument.height || 1123,
                    background: currentDocument.canvasBg || currentDocument.background || '#ffffff'
                };
            }

            // Prioritize Live Scraped Canvas (100% visual fidelity to editor)
            if (currentDocument.liveCanvas && currentDocument.liveCanvas.html) {
                renderLiveCanvas(currentDocument);
                return;
            }

            // Fallback: Render from serialized pages array
            renderSerializedPages();
        };

        function renderLiveCanvas(docData) {
            const stage = document.getElementById('page-stage');
            if (!stage) return;

            const w = (docData.liveCanvas && docData.liveCanvas.width) || 794;
            const h = (docData.liveCanvas && docData.liveCanvas.height) || 1123;
            const bg = docData.liveCanvas.background || '#ffffff';

            stage.style.width = w + 'px';
            stage.style.height = h + 'px';
            stage.style.background = bg;
            stage.innerHTML = (docData.liveCanvas && docData.liveCanvas.html) || '';

            // Clean up any residual placeholder headers, footers, or editor handles inside stage
            const residualHeaders = stage.querySelectorAll('.page-header, .page-footer');
            residualHeaders.forEach(el => {
                const t = (el.innerText || '').trim();
                if (!el.classList.contains('visible') || t === 'Header (Type here)' || t === 'Footer (Type here)' || t === '') {
                    el.remove();
                }
            });
            const residualGizmos = stage.querySelectorAll('.resize-handle, .rotate-handle, .rotate-stick, .margin-guides, #margin-guides, .selection-box, .guide-line, .canvas-cursor');
            residualGizmos.forEach(el => el.remove());
            const pubEls = stage.querySelectorAll('.pub-element');
            pubEls.forEach(el => {
                el.classList.remove('selected', 'editing-shape', 'cropping');
                el.removeAttribute('contenteditable');
            });

            const docTitle = docData.title || 'Untitled Publication';
            document.getElementById('preview-doc-title').textContent = docTitle;

            totalPages = (docData.pages && docData.pages.length > 0) ? docData.pages.length : 1;
            currentPageIndex = docData.currentPageIndex || 0;

            document.getElementById('preview-page-badge').textContent = `Page ${currentPageIndex + 1}/${totalPages}`;
            document.getElementById('page-display').textContent = `Page ${currentPageIndex + 1} of ${totalPages}`;
            const presPageEl = document.getElementById('pres-page-text');
            if (presPageEl) presPageEl.textContent = `Page ${currentPageIndex + 1} of ${totalPages}`;
            document.getElementById('footer-dimensions').textContent = `${w} x ${h} px`;

            const footerStatus = document.getElementById('footer-status-text');
            if (footerStatus) {
                footerStatus.textContent = 'Live Synced: ' + new Date().toLocaleTimeString();
            }

            applyZoom();
        }

        function renderSerializedPages() {
            const stage = document.getElementById('page-stage');
            if (!stage || !currentDocument) return;

            const pages = currentDocument.pages || [];
            if (pages.length === 0) return;

            totalPages = pages.length;
            if (currentPageIndex >= totalPages) currentPageIndex = totalPages - 1;
            if (currentPageIndex < 0) currentPageIndex = 0;

            const page = pages[currentPageIndex];
            const pWidth = parseInt(page.width || 794, 10);
            const pHeight = parseInt(page.height || 1123, 10);

            stage.style.width = pWidth + 'px';
            stage.style.height = pHeight + 'px';
            stage.style.background = page.background || '#ffffff';
            stage.innerHTML = '';

            const elements = page.elements || [];
            elements.forEach(el => {
                const elDiv = document.createElement('div');
                elDiv.style.position = 'absolute';
                elDiv.style.boxSizing = 'border-box';
                elDiv.style.overflow = 'hidden';
                elDiv.style.left = (typeof el.left === 'number' ? el.left + 'px' : el.left || '0px');
                elDiv.style.top = (typeof el.top === 'number' ? el.top + 'px' : el.top || '0px');
                elDiv.style.width = (typeof el.width === 'number' ? el.width + 'px' : el.width || '100px');
                elDiv.style.height = (typeof el.height === 'number' ? el.height + 'px' : el.height || '50px');

                if (el.background) elDiv.style.background = el.background;
                if (el.style) {
                    try {
                        Object.assign(elDiv.style, typeof el.style === 'string' ? JSON.parse(el.style) : el.style);
                    } catch(err) {}
                }

                if (el.content || el.innerHTML || el.text) {
                    elDiv.innerHTML = el.content || el.innerHTML || el.text || '';
                } else if (el.type === 'image' && el.src) {
                    const img = document.createElement('img');
                    img.src = el.src;
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'contain';
                    elDiv.appendChild(img);
                } else {
                    elDiv.style.border = el.border || '1px solid rgba(0,0,0,0.1)';
                }

                stage.appendChild(elDiv);
            });

            const docTitle = currentDocument.title || currentDocument.name || 'Untitled Publication';
            document.getElementById('preview-doc-title').textContent = docTitle;
            document.getElementById('preview-page-badge').textContent = `Page ${currentPageIndex + 1}/${totalPages}`;
            document.getElementById('page-display').textContent = `Page ${currentPageIndex + 1} of ${totalPages}`;
            const presPageEl = document.getElementById('pres-page-text');
            if (presPageEl) presPageEl.textContent = `Page ${currentPageIndex + 1} of ${totalPages}`;
            document.getElementById('footer-dimensions').textContent = `${pWidth} x ${pHeight} px`;

            applyZoom();
        }

        function requestLiveSync() {
            const mw = getMainWin();
            if (mw && typeof mw.requestLiveDocumentData === 'function') {
                mw.requestLiveDocumentData();
            }
        }

        // Zoom & Fit Calculations
        function applyZoom() {
            const viewport = document.getElementById('preview-viewport');
            const stage = document.getElementById('page-stage');
            const stageWrapper = document.getElementById('stage-wrapper');
            if (!viewport || !stage || !stageWrapper) return;

            const stageW = parseInt(stage.style.width, 10) || stage.offsetWidth || 794;
            const stageH = parseInt(stage.style.height, 10) || stage.offsetHeight || 1123;
            const availW = Math.max(100, viewport.clientWidth - 48);
            const availH = Math.max(100, viewport.clientHeight - 48);

            if (fitMode === 'page') {
                const scaleX = availW / stageW;
                const scaleY = availH / stageH;
                currentZoom = Math.min(scaleX, scaleY);
                if (currentZoom > 1.25) currentZoom = 1.25;
                viewport.scrollTop = 0;
                viewport.scrollLeft = 0;
            } else if (fitMode === 'width') {
                currentZoom = availW / stageW;
            }

            stageWrapper.style.width = (stageW * currentZoom) + 'px';
            stageWrapper.style.height = (stageH * currentZoom) + 'px';
            stage.style.width = stageW + 'px';
            stage.style.height = stageH + 'px';
            stage.style.transform = `scale(${currentZoom})`;
            stage.style.transformOrigin = 'top left';

            document.getElementById('zoom-label').textContent = `${Math.round(currentZoom * 100)}%`;
            document.getElementById('footer-scale').textContent = `Scale: ${Math.round(currentZoom * 100)}%`;
        }

        // Navigation
        function nextPage() {
            if (currentPageIndex < totalPages - 1) {
                const target = currentPageIndex + 1;
                const mw = getMainWin();
                if (mw && typeof mw.switchEditorPage === 'function') {
                    mw.switchEditorPage(target);
                } else {
                    currentPageIndex = target;
                    if (currentDocument && currentDocument.pages && currentDocument.pages.length > 0) {
                        renderSerializedPages();
                    }
                }
            }
        }
        function prevPage() {
            if (currentPageIndex > 0) {
                const target = currentPageIndex - 1;
                const mw = getMainWin();
                if (mw && typeof mw.switchEditorPage === 'function') {
                    mw.switchEditorPage(target);
                } else {
                    currentPageIndex = target;
                    if (currentDocument && currentDocument.pages && currentDocument.pages.length > 0) {
                        renderSerializedPages();
                    }
                }
            }
        }

        // Fullscreen / Slide Presentation Mode
        function toggleFullscreen() {
            isFullscreen = !isFullscreen;
            if (typeof nw !== 'undefined' && nw.Window) {
                const win = nw.Window.get();
                if (isFullscreen) win.enterFullscreen();
                else win.leaveFullscreen();
            }
            if (isFullscreen) {
                document.body.classList.add('fullscreen-mode');
                document.getElementById('presentation-hud').style.display = 'flex';
                showPresHud();
                fitMode = 'page';
            } else {
                document.body.classList.remove('fullscreen-mode');
                document.getElementById('presentation-hud').style.display = 'none';
            }
            setTimeout(applyZoom, 150);
        }

        function showPresHud() {
            const hud = document.getElementById('presentation-hud');
            if (!hud || !isFullscreen) return;
            hud.classList.add('show');
            if (hudFadeTimeout) clearTimeout(hudFadeTimeout);
            hudFadeTimeout = setTimeout(() => {
                hud.classList.remove('show');
            }, 3000);
        }

        // Event Listeners
        window.addEventListener('DOMContentLoaded', () => {
            syncTheme();
            requestLiveSync();

            // Setup periodic live sync poll (every 1.5s) if live sync is active
            liveSyncInterval = setInterval(() => {
                if (autoSyncActive) {
                    requestLiveSync();
                }
            }, 1500);


            // Fit buttons
            document.getElementById('btn-fit-page').addEventListener('click', () => {
                fitMode = 'page';
                document.getElementById('btn-fit-page').classList.add('active');
                document.getElementById('btn-fit-width').classList.remove('active');
                applyZoom();
            });
            document.getElementById('btn-fit-width').addEventListener('click', () => {
                fitMode = 'width';
                document.getElementById('btn-fit-width').classList.add('active');
                document.getElementById('btn-fit-page').classList.remove('active');
                applyZoom();
            });
            document.getElementById('btn-zoom-in').addEventListener('click', () => {
                fitMode = 'custom';
                document.getElementById('btn-fit-page').classList.remove('active');
                document.getElementById('btn-fit-width').classList.remove('active');
                currentZoom = Math.min(2.5, currentZoom + 0.1);
                applyZoom();
            });
            document.getElementById('btn-zoom-out').addEventListener('click', () => {
                fitMode = 'custom';
                document.getElementById('btn-fit-page').classList.remove('active');
                document.getElementById('btn-fit-width').classList.remove('active');
                currentZoom = Math.max(0.2, currentZoom - 0.1);
                applyZoom();
            });

            // Backdrop selector
            const vp = document.getElementById('preview-viewport');
            const bgOpts = [
                { id: 'bg-opt-dark', cls: 'bg-dark' },
                { id: 'bg-opt-black', cls: 'bg-black' },
                { id: 'bg-opt-light', cls: 'bg-light' },
                { id: 'bg-opt-grid', cls: 'bg-grid' }
            ];
            bgOpts.forEach(opt => {
                document.getElementById(opt.id).addEventListener('click', () => {
                    bgOpts.forEach(o => {
                        document.getElementById(o.id).classList.remove('selected');
                        vp.classList.remove(o.cls);
                    });
                    document.getElementById(opt.id).classList.add('selected');
                    vp.classList.add(opt.cls);
                });
            });

            // Live Sync Toggle
            const btnAutoSync = document.getElementById('btn-auto-sync');
            btnAutoSync.addEventListener('click', () => {
                autoSyncActive = !autoSyncActive;
                btnAutoSync.classList.toggle('active', autoSyncActive);
            });

            document.getElementById('btn-reload-preview').addEventListener('click', requestLiveSync);

            // Fullscreen controls
            document.getElementById('btn-fullscreen-toggle').addEventListener('click', toggleFullscreen);
            document.getElementById('pres-exit').addEventListener('click', toggleFullscreen);

            // Close & Dock
            function closePreviewWindow() {
                try {
                    const mw = getMainWin();
                    if (mw && typeof mw.dockDocPreview === 'function') {
                        mw.dockDocPreview(true);
                    }
                } catch(e) {}
                try {
                    if (typeof nw !== 'undefined' && nw.Window) {
                        nw.Window.get().close(true);
                        return;
                    }
                } catch(e) {}
                window.close();
            }

            document.getElementById('btn-dock').addEventListener('click', closePreviewWindow);
            document.getElementById('btn-close').addEventListener('click', closePreviewWindow);

            // Viewport mousemove for presentation HUD
            document.getElementById('preview-viewport').addEventListener('mousemove', () => {
                if (isFullscreen) showPresHud();
            });

            // Keyboard navigation
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'PageDown' || (isFullscreen && e.key === ' ')) {
                    nextPage();
                } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    prevPage();
                } else if (e.key === 'F11') {
                    e.preventDefault();
                    toggleFullscreen();
                } else if (e.key === 'Escape') {
                    if (isFullscreen) {
                        toggleFullscreen();
                    } else {
                        closePreviewWindow();
                    }
                }
            });

            window.addEventListener('resize', applyZoom);

            // Drag Handler with zero dead zones
            const header = document.getElementById('preview-header');
            let isDragging = false;
            let startX = 0, startY = 0;
            let initialWinX = 0, initialWinY = 0;

            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('.header-btn') || e.target.closest('button')) return;
                if (typeof nw === 'undefined' || !nw.Window) return;
                const win = nw.Window.get();
                isDragging = true;
                startX = e.screenX;
                startY = e.screenY;
                initialWinX = win.x;
                initialWinY = win.y;

                const onMouseMove = (moveEv) => {
                    if (!isDragging) return;
                    const dx = moveEv.screenX - startX;
                    const dy = moveEv.screenY - startY;
                    win.moveTo(initialWinX + dx, initialWinY + dy);
                };

                const onMouseUp = () => {
                    isDragging = false;
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                };

                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            });
        });
    </script>
</body>
</html>
